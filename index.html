    }
  });

  // ---- Live Analyzer (Web Audio API, local only - nothing recorded/sent) ----
  let analyzerStream = null, analyzerCtx = null, analyzerAnimFrame = null;
  let analyzerL = null, analyzerR = null;
  let waveformHistory = [];
  const WAVEFORM_MAX_POINTS = 400;
  let peakHoldL = 0, peakHoldR = 0, peakHoldDecay = 0.005;

  function dbFromPeak(peak){
    if(peak <= 0.0001) return -60;
    return Math.max(-60, 20 * Math.log10(peak));
  }

  // Canvases default to backing-store resolution == CSS pixel size, which
  // looks blurry on any HiDPI/Retina display (the classic canvas blur bug).
  // This sizes the actual pixel buffer to match device pixel density, then
  // scales the drawing context so all existing draw math (in CSS-pixel
  // units) still works unchanged, but renders crisp.
  //
  // Critically, it only touches canvas.width/height when the size actually
  // changed — reassigning them (even to the same value) always clears the
  // canvas, which was silently wiping the goniometer's persistence trail
  // every single frame before this fix.
  const canvasDPISizes = new WeakMap();
  function setupCanvasDPI(canvas){
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const last = canvasDPISizes.get(canvas);
    if(!last || last.w !== w || last.h !== h || last.dpr !== dpr){
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvasDPISizes.set(canvas, { w, h, dpr });
      const ctx2d = canvas.getContext('2d');
      ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { ctx2d: canvas.getContext('2d'), w, h };
  }

  function drawWaveform(){
    const canvas = document.getElementById('analyzerWaveform');
    const { ctx2d, w, h } = setupCanvasDPI(canvas);
    ctx2d.clearRect(0, 0, w, h);
    if(!analyzerL || !analyzerR) return;

    // Capture this frame's amplitude + how much of it is bass/mid/treble,
    // so the waveform can be colored by frequency content like a CDJ deck —
    // not just plain amplitude.
    const bufL = new Float32Array(analyzerL.fftSize);
    const bufR = new Float32Array(analyzerR.fftSize);
    analyzerL.getFloatTimeDomainData(bufL);
    analyzerR.getFloatTimeDomainData(bufR);
    let peak = 0;
    for(let i = 0; i < bufL.length; i++){
      const v = Math.max(Math.abs(bufL[i]), Math.abs(bufR[i]));
      if(v > peak) peak = v;
    }

    const freqData = new Uint8Array(analyzerL.frequencyBinCount);
    analyzerL.getByteFrequencyData(freqData);
    const nyquist = analyzerCtx.sampleRate / 2;
    const binHz = nyquist / freqData.length;
    let bass = 0, bassN = 0, mid = 0, midN = 0, treble = 0, trebleN = 0;
    for(let i = 0; i < freqData.length; i++){
      const freq = i * binHz;
      if(freq < 250){ bass += freqData[i]; bassN++; }
      else if(freq < 4000){ mid += freqData[i]; midN++; }
      else { treble += freqData[i]; trebleN++; }
    }
    const bassE = bassN ? (bass/bassN)/255 : 0;
    const midE = midN ? (mid/midN)/255 : 0;
    const trebleE = trebleN ? (treble/trebleN)/255 : 0;

    waveformHistory.push({ peak, bassE, midE, trebleE });
    if(waveformHistory.length > WAVEFORM_MAX_POINTS) waveformHistory.shift();

    const colWidth = w / WAVEFORM_MAX_POINTS;
    const midY = h / 2;
    waveformHistory.forEach((pt, i) => {
      const x = i * colWidth;
      const barH = Math.max(1, pt.peak * h * 0.95);
      const r = Math.min(255, 60 + pt.bassE * 255);
      const g = Math.min(255, 60 + pt.midE * 255);
      const b = Math.min(255, 80 + pt.trebleE * 255);
      ctx2d.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      ctx2d.fillRect(x, midY - barH/2, Math.max(1, colWidth - 0.5), barH);
    });
  }

  function drawSpectrum(){
    const canvas = document.getElementById('analyzerSpectrum');
    const { ctx2d, w, h } = setupCanvasDPI(canvas);
    ctx2d.clearRect(0, 0, w, h);
    if(!analyzerL) return;
    const bufferLength = analyzerL.frequencyBinCount;
    const data = new Uint8Array(bufferLength);
    analyzerL.getByteFrequencyData(data);

    // Dense point sampling (one per horizontal pixel-pair) drawn as a smooth
    // filled curve rather than a handful of blocky separated bars.
    const pointCount = Math.max(120, Math.floor(w / 2));
    const points = [];
    for(let i = 0; i < pointCount; i++){
      const idx = Math.floor(Math.pow(i / pointCount, 2) * bufferLength);
      points.push(data[idx] / 255);
    }

    const grad = ctx2d.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, 'rgba(74,222,128,.55)');
    grad.addColorStop(0.6, 'rgba(251,191,36,.6)');
    grad.addColorStop(1, 'rgba(225,29,72,.75)');

    ctx2d.beginPath();
    ctx2d.moveTo(0, h);
    points.forEach((val, i) => {
      const x = (i / (pointCount - 1)) * w;
      const y = h - val * h;
      ctx2d.lineTo(x, y);
    });
    ctx2d.lineTo(w, h);
    ctx2d.closePath();
    ctx2d.fillStyle = grad;
    ctx2d.fill();

    // Crisp top edge line for definition
    ctx2d.beginPath();
    points.forEach((val, i) => {
      const x = (i / (pointCount - 1)) * w;
      const y = h - val * h;
      if(i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
    });
    ctx2d.strokeStyle = 'rgba(255,255,255,.5)';
    ctx2d.lineWidth = 1;
    ctx2d.stroke();
  }

  function drawMeters(){
    const canvas = document.getElementById('analyzerMeters');
    const { ctx2d, w, h } = setupCanvasDPI(canvas);
    ctx2d.clearRect(0, 0, w, h);
    if(!analyzerL || !analyzerR) return;

    const bufL = new Float32Array(analyzerL.fftSize);
    const bufR = new Float32Array(analyzerR.fftSize);
    analyzerL.getFloatTimeDomainData(bufL);
    analyzerR.getFloatTimeDomainData(bufR);
    const peakL = Math.max(...Array.from(bufL, Math.abs));
    const peakR = Math.max(...Array.from(bufR, Math.abs));
    const dbL = dbFromPeak(peakL), dbR = dbFromPeak(peakR);

    peakHoldL = Math.max(dbL, peakHoldL - peakHoldDecay * 60);
    peakHoldR = Math.max(dbR, peakHoldR - peakHoldDecay * 60);

    const barGap = 6, barW = (w - barGap * 3) / 2;
    [ ['L', dbL, peakHoldL, barGap], ['R', dbR, peakHoldR, barGap*2 + barW] ].forEach(([label, db, hold, x]) => {
      const pct = Math.max(0, (db + 60) / 60);
      const holdPct = Math.max(0, (hold + 60) / 60);
      ctx2d.fillStyle = 'rgba(255,255,255,.06)';
      ctx2d.fillRect(x, 0, barW, h);
      const barH = pct * h;
      const grad = ctx2d.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0, '#4ade80'); grad.addColorStop(0.7, '#fbbf24'); grad.addColorStop(1, '#e11d48');
      ctx2d.fillStyle = grad;
      ctx2d.fillRect(x, h - barH, barW, barH);
      ctx2d.fillStyle = '#fff';
      ctx2d.fillRect(x, h - holdPct*h - 1, barW, 2);
      ctx2d.fillStyle = 'var(--text-dim)';
      ctx2d.font = "9px 'JetBrains Mono', monospace";
      ctx2d.fillText(label, x + barW/2 - 3, h - 4);
    });
  }

  function drawGonio(){
    const canvas = document.getElementById('analyzerGonio');
    const { ctx2d, w, h } = setupCanvasDPI(canvas);
    if(!analyzerL || !analyzerR){
      ctx2d.clearRect(0, 0, w, h);
      return;
    }

    // Fade the previous frame instead of clearing it, for a phosphor-persistence
    // trail effect like real hardware goniometers/vectorscopes have.
    ctx2d.fillStyle = 'rgba(15,15,17,0.22)';
    ctx2d.fillRect(0, 0, w, h);

    const cx = w / 2, cy = h / 2;
    const scale = Math.min(w, h) / 2 * 0.85;

    // Reference lines: vertical = mono (L=R), diagonals = hard-left/hard-right only.
    ctx2d.strokeStyle = 'rgba(255,255,255,.08)';
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(cx, cy - scale); ctx2d.lineTo(cx, cy + scale);
    ctx2d.moveTo(cx - scale, cy); ctx2d.lineTo(cx + scale, cy);
    ctx2d.stroke();
    ctx2d.strokeStyle = 'rgba(255,255,255,.04)';
    ctx2d.beginPath();
    ctx2d.moveTo(cx - scale*0.7, cy - scale*0.7); ctx2d.lineTo(cx + scale*0.7, cy + scale*0.7);
    ctx2d.moveTo(cx + scale*0.7, cy - scale*0.7); ctx2d.lineTo(cx - scale*0.7, cy + scale*0.7);
    ctx2d.stroke();

    const bufL = new Float32Array(analyzerL.fftSize);
    const bufR = new Float32Array(analyzerR.fftSize);
    analyzerL.getFloatTimeDomainData(bufL);
    analyzerR.getFloatTimeDomainData(bufR);

    // Classic 45°-rotated Mid/Side plot: mono signal draws a vertical line,
    // full stereo width spreads horizontally — same convention as Ozone
    // Imager / MiniMeters' goniometer.
    ctx2d.fillStyle = 'rgba(225,29,72,.55)';
    const step = 16; // subsample for performance - buffer is now 8192 samples (was 2048), keep same point density
    for(let i = 0; i < bufL.length; i += step){
      const l = bufL[i], r = bufR[i];
      const x = cx + (r - l) * scale * 0.7;
      const y = cy - (r + l) * scale * 0.7;
      ctx2d.fillRect(x, y, 1.5, 1.5);
    }

    ctx2d.fillStyle = 'var(--text-dim)';
    ctx2d.font = "8px 'JetBrains Mono', monospace";
    ctx2d.fillText('M', cx - 3, 12);
    ctx2d.fillText('S', w - 12, cy + 3);
  }

  function drawCorrelation(){
    const canvas = document.getElementById('analyzerCorrelation');
    const { ctx2d, w, h } = setupCanvasDPI(canvas);
    ctx2d.clearRect(0, 0, w, h);
    if(!analyzerL || !analyzerR) return;

    const bufL = new Float32Array(analyzerL.fftSize);
    const bufR = new Float32Array(analyzerR.fftSize);
    analyzerL.getFloatTimeDomainData(bufL);
    analyzerR.getFloatTimeDomainData(bufR);
    let sumLR = 0, sumLL = 0, sumRR = 0;
    for(let i = 0; i < bufL.length; i++){
      sumLR += bufL[i] * bufR[i];
      sumLL += bufL[i] * bufL[i];
      sumRR += bufR[i] * bufR[i];
    }
    const denom = Math.sqrt(sumLL * sumRR);
    const correlation = denom > 0.00001 ? sumLR / denom : 1;

    ctx2d.fillStyle = 'var(--text-dim)';
    ctx2d.font = "9px 'JetBrains Mono', monospace";
    ctx2d.fillText('PHASE', 8, 14);

    const midY = h / 2 + 6;
    const barTop = midY - 8, barH2 = 16;
    ctx2d.fillStyle = 'rgba(255,255,255,.08)';
    ctx2d.fillRect(8, barTop, w - 16, barH2);
    const center = 8 + (w - 16) / 2;
    const pos = center + (correlation) * (w - 16) / 2;
    const color = correlation < -0.2 ? '#e11d48' : (correlation < 0.4 ? '#fbbf24' : '#4ade80');
    ctx2d.fillStyle = color;
    ctx2d.fillRect(Math.min(center, pos), barTop, Math.abs(pos - center), barH2);
    ctx2d.fillStyle = '#fff';
    ctx2d.fillRect(center - 1, barTop - 3, 2, barH2 + 6);

    ctx2d.fillStyle = 'var(--text-dim)';
    ctx2d.font = "8px 'JetBrains Mono', monospace";
    ctx2d.fillText('-1', 6, h - 4);
    ctx2d.fillText('+1', w - 18, h - 4);
    ctx2d.fillText(correlation.toFixed(2), center - 10, h - 24);
  }

  function analyzerLoop(){
    drawWaveform();
    drawSpectrum();
    drawMeters();
    drawGonio();
    drawCorrelation();
    analyzerAnimFrame = requestAnimationFrame(analyzerLoop);
  }

  async function startAnalyzer(){
    const btn = document.getElementById('analyzerToggleBtn');
    waveformHistory = [];
    try{
      analyzerStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      // Video is only requested because Chrome requires it for getDisplayMedia —
      // we don't need it, so stop it immediately to free up resources.
      analyzerStream.getVideoTracks().forEach(t => t.stop());
      if(!analyzerStream.getAudioTracks().length){
        alert('No audio track was shared — make sure to check "Share audio" in the picker.');
        analyzerStream.getTracks().forEach(t => t.stop());
        analyzerStream = null;
        return;
      }
      analyzerCtx = new (window.AudioContext || window.webkitAudioContext)();
      const track = analyzerStream.getAudioTracks()[0];
      const settings = track.getSettings ? track.getSettings() : {};
      console.log('Analyzer audio track channels:', settings.channelCount || 'unknown', settings);

      const source = analyzerCtx.createMediaStreamSource(analyzerStream);
      // Web Audio's default channelInterpretation is "speakers", which applies
      // automatic up/down-mixing based on channel count heuristics - this can
      // silently collapse or blend true stereo content. Forcing "discrete"
      // here and on the splitter guarantees each channel passes through
      // untouched instead of being summed.
      source.channelCount = 2;
      source.channelCountMode = 'explicit';
      source.channelInterpretation = 'discrete';

      const splitter = analyzerCtx.createChannelSplitter(2);
      splitter.channelInterpretation = 'discrete';
      source.connect(splitter);
      analyzerL = analyzerCtx.createAnalyser();
      analyzerR = analyzerCtx.createAnalyser();
      analyzerL.fftSize = 8192;
      analyzerR.fftSize = 8192;
      splitter.connect(analyzerL, 0);
      splitter.connect(analyzerR, 1);

      analyzerStream.getAudioTracks()[0].addEventListener('ended', stopAnalyzer);

      btn.textContent = 'Stop';
      analyzerLoop();
    }catch(err){
      console.error('analyzer start failed', err);
      if(err.name !== 'NotAllowedError') alert('Could not start analyzer: ' + err.message);
    }
  }

  function stopAnalyzer(){
    if(analyzerAnimFrame) cancelAnimationFrame(analyzerAnimFrame);
    analyzerAnimFrame = null;
    if(analyzerStream) analyzerStream.getTracks().forEach(t => t.stop());
    analyzerStream = null;
    if(analyzerCtx) analyzerCtx.close();
    analyzerCtx = null;
    analyzerL = null; analyzerR = null;
    document.getElementById('analyzerToggleBtn').textContent = 'Start';
    ['analyzerWaveform', 'analyzerSpectrum', 'analyzerMeters', 'analyzerGonio', 'analyzerCorrelation'].forEach(id => {
      const c = document.getElementById(id);
      const ctx2d = c.getContext('2d');
      ctx2d.clearRect(0, 0, c.width, c.height);
    });
  }

  document.getElementById('analyzerToggleBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if(analyzerStream) stopAnalyzer(); else startAnalyzer();
  });
</script>

</body>
</html>
