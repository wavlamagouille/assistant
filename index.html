<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAV / ASSISTANT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css">
<script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --bg: #18181b;
    --bg-raised: #1f1f23;
    --line: #2c2c31;
    --rose: #9f1239;
    --rose-bright: #e11d48;
    --text: #f4f4f5;
    --text-dim: #71717a;
    --text-mid: #a1a1aa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--rose); color:#fff; }

  /* ---------- BOOT ---------- */
  #boot{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    z-index:100;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #boot.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .bars{
    display:flex; align-items:flex-end; gap:5px; height:64px;
  }
  .bars span{
    width:5px;
    background:var(--rose-bright);
    border-radius:1px;
    animation:meter 1.1s ease-in-out infinite;
    opacity:.9;
  }
  .bars span:nth-child(1){ animation-delay:0s; }
  .bars span:nth-child(2){ animation-delay:.08s; }
  .bars span:nth-child(3){ animation-delay:.16s; }
  .bars span:nth-child(4){ animation-delay:.24s; }
  .bars span:nth-child(5){ animation-delay:.32s; }
  .bars span:nth-child(6){ animation-delay:.4s; }
  .bars span:nth-child(7){ animation-delay:.48s; }
  .bars span:nth-child(8){ animation-delay:.56s; }
  .bars span:nth-child(9){ animation-delay:.64s; }
  .bars span:nth-child(10){ animation-delay:.72s; }
  .bars span:nth-child(11){ animation-delay:.8s; }
  .bars span:nth-child(12){ animation-delay:.88s; }
  @keyframes meter{
    0%,100%{ height:6px; }
    50%{ height:var(--h, 58px); }
  }
  #boot-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.25em;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  /* ---------- SHELL ---------- */
  #shell{
    min-height:100%;
    display:flex; flex-direction:column;
    opacity:0;
    transition:opacity .7s ease;
  }
  #shell.show{ opacity:1; }

  header{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    overflow:hidden;
  }
  header .amb{
    position:absolute; inset:0;
    display:flex; align-items:flex-end; gap:3px;
    padding:0 32px;
    opacity:.08;
    pointer-events:none;
  }
  header .amb span{
    flex:1;
    background:var(--rose-bright);
    animation:meter 2.4s ease-in-out infinite;
  }
  .brand{ position:relative; display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    letter-spacing:.06em;
    line-height:1;
  }
  .brand .mark span{ color:var(--rose-bright); }
  .brand .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:.15em;
    text-transform:uppercase;
  }
  .status{ position:relative; display:flex; align-items:center; gap:22px; }

  .quick-links{ position:relative; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .quick-link{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px;
    opacity:.7;
    transition:opacity .15s ease, transform .15s ease;
  }
  .quick-link:hover{ opacity:1; transform:translateY(-1px); }
  .quick-link img{ width:100%; height:100%; object-fit:contain; display:block; }
  .quick-link-fallback{
    display:none; width:20px; height:20px; border-radius:50%;
    background:var(--bg-raised); border:1px solid var(--line);
    align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:8px; letter-spacing:.02em;
    color:var(--text-mid);
  }
  .quick-link.fallback img{ display:none; }
  .quick-link.fallback .quick-link-fallback{ display:flex; }
  @media (max-width: 900px){ .quick-links{ display:none; } }

  .clock{
    font-family:'JetBrains Mono', monospace;
    text-align:right;
    line-height:1.3;
  }
  .clock .time{ font-size:15px; color:var(--text); }
  .clock .date{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; }
  .live{ display:flex; align-items:center; gap:7px; }
  .live .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--rose-bright);
    box-shadow:0 0 0 0 rgba(225,29,72,.6);
    animation:pulse 2s infinite;
  }
  .live .txt{
    font-family:'JetBrains Mono', monospace;
    font-size:9px; letter-spacing:.2em;
    color:var(--text-dim); text-transform:uppercase;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(225,29,72,.5); }
    70%{ box-shadow:0 0 0 8px rgba(225,29,72,0); }
    100%{ box-shadow:0 0 0 0 rgba(225,29,72,0); }
  }

  main{
    padding:28px 32px 32px;
  }
  .grid-stack{ background:transparent; }
  .grid-stack-item-content{
    inset:0 !important;
    overflow:visible !important;
  }
  .grid-stack-item .tile{
    height:100%;
    margin:0;
  }
  /* theme the resize handles to match the dark UI instead of default gray */
  .grid-stack-item > .ui-resizable-handle{ opacity:0; transition:opacity .15s ease; }
  .grid-stack-item:hover > .ui-resizable-handle{ opacity:1; }
  .grid-stack-item > .ui-resizable-se{
    background: linear-gradient(135deg, transparent 0 40%, var(--rose-bright) 40% 60%, transparent 60% 100%);
    width:14px; height:14px; right:4px; bottom:4px;
  }
  .grid-stack-item.ui-draggable-dragging .tile,
  .grid-stack-item.ui-resizable-resizing .tile{
    border-color:var(--rose-bright);
  }

  .leaflet-container{ background:#0f0f11; font-family:'JetBrains Mono', monospace; }
  .leaflet-control-attribution{ background:rgba(24,24,27,.85)!important; color:var(--text-dim)!important; font-size:9px!important; }
  .leaflet-control-attribution a{ color:var(--text-mid)!important; }
  .leaflet-bar a{ background:var(--bg-raised)!important; color:var(--text)!important; border-color:var(--line)!important; }
  .leaflet-bar a:hover{ background:var(--rose)!important; }

  .radar-modal-map{
    height:60vh;
    min-height:360px;
    width:100%;
    background:#0f0f11;
  }
  .radar-controls{
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
    border-top:1px solid var(--line);
  }
  .radar-controls input[type="range"]{
    flex:1;
    accent-color:var(--rose-bright);
  }
  .radar-controls .tile-idx{ min-width:56px; text-align:right; }

  .precip-outlook-wrap{ padding:12px 20px 18px; border-top:1px solid var(--line); }
  .precip-outlook-label{
    font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:.12em;
    color:var(--text-dim); text-transform:uppercase; margin-bottom:8px;
  }
  .precip-summary{
    font-size:14px; color:var(--text); margin-bottom:10px;
  }

  .city-suggestions{
    display:none;
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:2px;
    max-height:220px;
    overflow-y:auto;
    z-index:20;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .city-suggestions.show{ display:block; }
  .city-suggestion{
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:10px;
  }
  .city-suggestion:last-child{ border-bottom:none; }
  .city-suggestion:hover{ background:var(--bg); }
  .city-suggestion .cs-name{ color:var(--text); }
  .city-suggestion .cs-region{ color:var(--text-dim); font-family:'JetBrains Mono', monospace; font-size:11px; white-space:nowrap; }

  .transit-input{
    background:var(--bg); border:1px solid var(--line); border-radius:2px;
    color:var(--text); padding:7px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px; outline:none;
  }
  .transit-input::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; opacity:.7; }
  .transit-leg{ display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12px; color:var(--text-mid); }
  .transit-leg-dot{ width:6px; height:6px; border-radius:50%; background:var(--rose-bright); flex-shrink:0; }
  .transit-conn{ padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; transition:opacity .15s ease; }
  .transit-conn:hover{ opacity:.8; }
  .transit-conn:last-child{ border-bottom:none; }
  .transit-sbb-link:hover{ text-decoration:underline; }
  .precip-outlook{ display:flex; align-items:flex-end; gap:3px; height:56px; }
  .precip-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px; }
  .precip-bar{ width:100%; max-width:14px; background:var(--rose-bright); opacity:.75; border-radius:1px 1px 0 0; min-height:2px; }
  .precip-bar-hour{ font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-dim); }
  .radar-placeholder{
    display:flex; align-items:center; justify-content:center;
    height:100%; width:100%;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-dim);
  }

  .tile{
    position:relative;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:3px;
    padding:20px 22px;
    display:flex; flex-direction:column;
    gap:14px;
    min-height:150px;
    transition:border-color .2s ease;
  }
  .tile:hover{ border-color:#3f3f46; }
  .tile::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0;
    width:3px;
    border-radius:3px 0 0 3px;
    background:var(--line);
    transition:background .2s ease;
  }
  .tile:hover::before{ background:var(--rose-bright); }

  .tile-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .tile-head .tile-head-right{ display:flex; align-items:center; gap:8px; }
  .icon-refresh-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; flex-shrink:0;
    background:none; border:none;
    color:var(--text-dim);
    cursor:pointer;
    border-radius:50%;
    padding:0;
    transition:color .15s ease, background .15s ease;
  }
  .icon-refresh-btn:hover{ color:var(--rose-bright); background:rgba(225,29,72,.12); }
  .icon-refresh-btn svg{ transition:transform .5s ease; }
  .icon-refresh-btn.spinning svg{ transform:rotate(360deg); }
  .tile-name{
    font-family:'Bebas Neue', sans-serif;
    font-size:19px;
    letter-spacing:.04em;
    color:var(--text);
  }
  .tile-idx{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
  }
  .tile-body{
    display:flex; flex-direction:column;
    align-items:flex-start; justify-content:flex-start;
    gap:6px;
    max-height:320px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .tile-body::-webkit-scrollbar{ width:6px; }
  .tile-body::-webkit-scrollbar-track{ background:transparent; }
  .tile-body::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .tile-body::-webkit-scrollbar-thumb:hover{ background:#3f3f46; }
  .tile-state{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .tile-state.off::before{ content:'○  '; color:var(--text-dim); }
  .tile-hint{
    font-size:13px;
    color:var(--text-mid);
    line-height:1.5;
  }
  .tile-cta{
    align-self:flex-start;
    margin-top:2px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--rose-bright);
    background:none; border:1px solid var(--rose);
    padding:7px 12px;
    border-radius:2px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tile-cta:hover{ background:var(--rose-bright); color:#18181b; border-color:var(--rose-bright); }

  .chat-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; flex-shrink:0;
    background:none; border:1px solid var(--line);
    color:var(--text-mid);
    cursor:pointer;
    border-radius:3px;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .chat-toggle-btn:hover, .chat-toggle-btn.active{
    color:var(--rose-bright); border-color:var(--rose-bright); background:rgba(225,29,72,.1);
  }

  .chat-panel{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw;
    background:var(--bg-raised); border-left:1px solid var(--line);
    box-shadow:-12px 0 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
    padding:20px;
    gap:14px;
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:200;
  }
  .chat-panel.open{ transform:translateX(0); }
  .chat-panel.resizing{ transition:none; }
  .chat-panel-resize{
    position:absolute; left:-4px; top:0; bottom:0; width:8px;
    cursor:ew-resize; z-index:201;
  }
  .chat-panel-resize:hover, .chat-panel.resizing .chat-panel-resize{ background:rgba(225,29,72,.25); }
  .chat-panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:14px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .chat-panel-head .tile-name{ font-size:19px; }

  .chat-messages{
    display:flex; flex-direction:column; gap:10px;
    flex:1; min-height:0; overflow-y:auto;
    padding:4px 2px;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
    justify-content:flex-start;
  }
  .chat-messages::-webkit-scrollbar{ width:6px; }
  .chat-messages::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .chat-msg{ max-width:75%; padding:9px 13px; border-radius:3px; font-size:13px; line-height:1.5; white-space:pre-wrap; }
  .chat-msg.assistant{ max-width:96%; white-space:normal; }
  .chat-msg.user{ align-self:flex-end; background:var(--rose); color:#fff; }
  .chat-msg.assistant p{ margin:0 0 8px; }
  .chat-msg.assistant p:last-child{ margin-bottom:0; }
  .chat-msg.assistant strong{ color:var(--text); font-weight:600; }
  .chat-msg.assistant ul, .chat-msg.assistant ol{ margin:0 0 8px; padding-left:18px; }
  .chat-msg.assistant li{ margin-bottom:3px; }
  .chat-msg.assistant h1, .chat-msg.assistant h2, .chat-msg.assistant h3{
    font-family:'Bebas Neue', sans-serif; letter-spacing:.03em; color:var(--text);
    margin:10px 0 6px; font-size:16px;
  }
  .chat-msg.assistant h1:first-child, .chat-msg.assistant h2:first-child, .chat-msg.assistant h3:first-child{ margin-top:0; }
  .chat-msg.assistant code{
    background:rgba(0,0,0,.3); border-radius:2px; padding:1px 5px;
    font-family:'JetBrains Mono', monospace; font-size:.9em;
  }
  .chat-msg.assistant pre{
    background:rgba(0,0,0,.3); border-radius:3px; padding:10px; overflow-x:auto; margin:0 0 8px;
  }
  .chat-msg.assistant pre code{ background:none; padding:0; }
  .chat-msg.assistant table{
    border-collapse:collapse; width:100%; margin:0 0 8px; font-size:12px;
  }
  .chat-msg.assistant th, .chat-msg.assistant td{
    border:1px solid rgba(255,255,255,.15); padding:5px 8px; text-align:left;
  }
  .chat-msg.assistant th{ font-family:'JetBrains Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); }
  .chat-msg.assistant a{ color:var(--rose-bright); }
  .chat-msg.assistant blockquote{
    border-left:2px solid var(--rose); margin:0 0 8px; padding-left:10px; color:var(--text-mid);
  }
  .chat-msg.assistant{ align-self:flex-start; background:var(--bg); border:1px solid var(--line); color:var(--text); }
  .chat-msg.system{ align-self:center; color:var(--rose-bright); font-family:'JetBrains Mono',monospace; font-size:11px; text-align:center; }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:2px;
    color:var(--text); padding:9px 12px; font-family:'Space Grotesk',sans-serif; font-size:13px; outline:none;
  }

  footer{
    flex-shrink:0;
    padding:10px 32px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:.15em;
    color:var(--text-dim);
    text-transform:uppercase;
    display:flex; justify-content:space-between;
  }

  @media (max-width: 640px){
    header{ padding:16px 20px; }
    main{ padding:20px; grid-template-columns:1fr; }
    footer{ padding:10px 20px; }
  }

  .coin-row{ cursor:pointer; padding:4px 0; border-radius:2px; transition:opacity .15s ease; }
  .coin-row:hover{ opacity:.75; }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,.7);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    opacity:0; visibility:hidden;
    transition:opacity .2s ease, visibility .2s ease;
  }
  .modal-backdrop.show{ opacity:1; visibility:visible; }
  .modal-panel{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:4px;
    width:min(920px, 92vw);
    max-height:88vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
  }
  .modal-title{
    font-family:'Bebas Neue', sans-serif;
    font-size:20px;
    letter-spacing:.04em;
  }
  .modal-close{
    background:none; border:1px solid var(--line);
    color:var(--text-mid);
    width:28px; height:28px;
    border-radius:2px;
    cursor:pointer;
    font-size:14px;
    transition:border-color .15s ease, color .15s ease;
  }
  .modal-close:hover{ border-color:var(--rose-bright); color:var(--rose-bright); }
  #tv-chart-container{ height:520px; width:100%; }
  @media (max-width: 640px){
    .modal-panel{ width:96vw; }
    #tv-chart-container{ height:70vh; }
  }
</style>
</head>
<body>

  <div id="boot">
    <div class="bars" id="bootBars"></div>
    <div id="boot-label">BOOTING</div>
  </div>

  <div id="shell">
    <header>
      <div class="amb" id="ambBars"></div>
      <div class="brand">
        <div class="mark">WAV<span>/</span>ASSISTANT</div>
        <div class="sub">Personal console</div>
      </div>
      <div class="quick-links" id="quickLinks"></div>
      <div class="status">
        <div class="live"><div class="dot"></div><div class="txt">Online</div></div>
        <div class="clock">
          <div class="time" id="time">--:--:--</div>
          <div class="date" id="date">-- --- ----</div>
        </div>
        <button class="chat-toggle-btn" id="chatToggleBtn" title="AI Chat" aria-label="Toggle AI Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-panel" id="chatPanel">
      <div class="chat-panel-resize" id="chatPanelResize"></div>
      <div class="chat-panel-head">
        <div style="display:flex; align-items:baseline; gap:10px;">
          <div class="tile-name">AI CHAT</div>
          <span class="tile-idx" id="chatPanelModel"></span>
        </div>
        <button class="modal-close" id="chatPanelClose">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Ask about your day…">
        <button class="tile-cta" id="chatSendBtn" style="margin-top:0;">Send</button>
      </div>
    </div>

    <main id="grid" class="grid-stack">
      <!-- tiles injected by JS -->
    </main>

<script>
  // ---- boot bars ----
  const bootBars = document.getElementById('bootBars');
  for(let i=0;i<12;i++){
    const s = document.createElement('span');
    s.style.setProperty('--h', (24 + Math.random()*46).toFixed(0)+'px');
    bootBars.appendChild(s);
  }
  const ambBars = document.getElementById('ambBars');
  for(let i=0;i<48;i++){
    const s = document.createElement('span');
    s.style.setProperty('--h', (10 + Math.random()*40).toFixed(0)+'px');
    s.style.animationDelay = (Math.random()*2.4).toFixed(2)+'s';
    ambBars.appendChild(s);
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('boot').classList.add('hide');
      document.getElementById('shell').classList.add('show');
    }, 900);
  });

  // ---- clock ----
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function tick(){
    const n = new Date();
    document.getElementById('time').textContent =
      String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
    document.getElementById('date').textContent =
      days[n.getDay()]+' '+String(n.getDate()).padStart(2,'0')+' '+months[n.getMonth()]+' '+n.getFullYear();
  }
  tick(); setInterval(tick, 1000);

  // ---- quick links (Simple Icons CDN - free, accurate brand icons, CC0) ----
  const QUICK_LINKS = [
    { name:'YouTube',      url:'https://youtube.com',      slug:'youtube',      color:'FF0000', short:'YT' },
    { name:'Twitch',       url:'https://twitch.tv',        slug:'twitch',       color:'9146FF', short:'TW' },
    { name:'Instagram',    url:'https://instagram.com',    slug:'instagram',    color:'E4405F', short:'IG' },
    { name:'UFC.TV',       url:'https://ufc.tv',           slug:'ufc',          color:'D20A0A', short:'UFC' },
    { name:'Kick',         url:'https://kick.com',         slug:'kick',         color:'53FC18', short:'K' },
    { name:'SoundCloud',   url:'https://soundcloud.com',   slug:'soundcloud',   color:'FF5500', short:'SC' },
    { name:'GitHub',       url:'https://github.com',       slug:'github',       color:'FFFFFF', short:'GH' }
  ];
  const quickLinksEl = document.getElementById('quickLinks');
  quickLinksEl.innerHTML = QUICK_LINKS.map(l => `
    <a href="${l.url}" target="_blank" rel="noopener" class="quick-link" title="${l.name}">
      <img src="https://cdn.simpleicons.org/${l.slug}/${l.color}" alt="${l.name}"
           onerror="this.parentElement.classList.add('fallback')">
      <span class="quick-link-fallback">${l.short}</span>
    </a>
  `).join('');


  // ---- modules ----
  const modules = [
    { id:'weather',  name:'WEATHER',    idx:'01', hint:"Today's local forecast." },
    { id:'mail',     name:'EMAIL',      idx:'02', hint:'Daily summary of your Gmail inbox.' },
    { id:'agenda',   name:'CALENDAR',   idx:'03', hint:'Upcoming Google Calendar events.' },
    { id:'markets',  name:'MARKETS',    idx:'04', hint:'Tracked crypto & asset prices, with charts.' },
    { id:'news',     name:'NEWS',       idx:'05', hint:'BBC, CoinDesk, and Attack Magazine headlines.' },
    { id:'mastering',name:'MASTERING',  idx:'06', hint:'Status of Wavaudiolab client submissions.' },
    { id:'transit',  name:'TRANSIT',    idx:'08', hint:'Swiss public transport connections (CFF & more).' },
  ];

  const grid = document.getElementById('grid');
  // Default sizes in a 12-column grid: weather + chat span full width,
  // the five utility tiles sit 3-per-row. User can drag/resize freely from
  // here — this is just the starting layout.
  const DEFAULT_SIZE = {
    weather: { w:12, h:6 },
    mail:    { w:4,  h:5 },
    agenda:  { w:4,  h:5 },
    markets: { w:4,  h:5 },
    news:    { w:4,  h:5 },
    mastering:{ w:4, h:5 },
    notes:   { w:4,  h:5 },
    transit: { w:6,  h:5 }
  };

  function wrapAsGridItem(id, tileEl){
    const size = DEFAULT_SIZE[id] || { w:4, h:5 };
    const item = document.createElement('div');
    item.className = 'grid-stack-item';
    item.setAttribute('gs-id', id);
    item.setAttribute('gs-w', size.w);
    item.setAttribute('gs-h', size.h);
    const content = document.createElement('div');
    content.className = 'grid-stack-item-content';
    content.appendChild(tileEl);
    item.appendChild(content);
    return item;
  }

  modules.forEach(m => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.module = m.id;
    tile.innerHTML = `
      <div class="tile-head">
        <div class="tile-name">${m.name}</div>
        <div class="tile-head-right">
          <div class="tile-idx">${m.idx}</div>
        </div>
      </div>
      <div class="tile-state off">Not connected</div>
      <div class="tile-body">
        <div class="tile-hint">${m.hint}</div>
      </div>
      <button class="tile-cta" data-module="${m.id}">Connect</button>
    `;
    grid.appendChild(wrapAsGridItem(m.id, tile));
  });

  const notes = document.createElement('div');
  notes.className = 'tile';
  notes.dataset.module = 'notes';
  notes.innerHTML = `
    <div class="tile-head">
      <div class="tile-name">NOTES</div>
      <div class="tile-head-right"><div class="tile-idx">07</div></div>
    </div>
    <textarea id="notesArea" placeholder="Jot something down…" style="width:100%; flex:1; min-height:0; resize:none; background:var(--bg); border:1px solid var(--line); border-radius:2px; color:var(--text); padding:10px 12px; font-family:'Space Grotesk',sans-serif; font-size:13px; line-height:1.5; outline:none;"></textarea>
    <button class="tile-cta" id="notesClearBtn">Clear</button>
  `;
  grid.appendChild(wrapAsGridItem('notes', notes));

  // ---- GridStack init: drag, resize, and persisted layout ----
  const gridStack = GridStack.init({
    column: 12,
    cellHeight: 70,
    margin: 8,
    float: true,
    resizable: { handles: 'se' },
    draggable: { handle: '.tile-head, .chat-left' }
  }, '#grid');

  function saveLayout(){
    try{
      const layout = gridStack.save(false);
      localStorage.setItem('dashboard_layout', JSON.stringify(layout));
    }catch(err){ console.warn('layout save failed', err); }
  }

  const savedLayoutRaw = localStorage.getItem('dashboard_layout');
  if(savedLayoutRaw){
    try{
      gridStack.load(JSON.parse(savedLayoutRaw), false);
    }catch(err){ console.warn('layout load failed, using defaults', err); }
  }

  gridStack.on('change', saveLayout);


  const connected = new Set();
  function refreshCount(){
    document.getElementById('modcount').textContent = connected.size + ' / 7 MODULES CONNECTED';
  }
  refreshCount();

  // These modules aren't fake-"coming soon" — they genuinely need something
  // from Flo before they can go live (credentials, a project config, an API key).
  // Clicking Connect tells you exactly what's missing instead of pretending.
  const NEEDS = {};

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.tile-cta');
    if(!btn) return;
    const mod = btn.dataset.module;
    if(mod === 'weather' || mod === 'markets' || mod === 'chat' || mod === 'mail' || mod === 'agenda' || mod === 'news' || mod === 'mastering' || mod === 'transit') return; // already live

    const tile = btn.closest('.tile');
    const stateEl = tile.querySelector('.tile-state');
    if(stateEl){
      stateEl.textContent = 'Setup required';
      stateEl.classList.remove('off');
      stateEl.style.color = 'var(--rose-bright)';
    }
    let noteEl = tile.querySelector('.tile-need');
    if(!noteEl){
      noteEl = document.createElement('div');
      noteEl.className = 'tile-hint tile-need';
      noteEl.style.color = 'var(--text-dim)';
      (tile.querySelector('.tile-body') || tile.querySelector('.chat-left')).appendChild(noteEl);
    }
    noteEl.textContent = NEEDS[mod] || 'Needs setup.';
  });

  // ---- weather module (Open-Meteo, no key needed) ----
  // Default location: Rolle, VD. Change LOCATION to move it.
  const LOCATION = { name: 'Rolle, VD', lat: 46.4667, lon: 6.3333 };

  // Every fetch in this app should use this — a hung request (bad wifi, a
  // stalled connection) will now fail loudly after 10s instead of leaving
  // a "Loading…" state stuck forever with no way to recover.
  async function fetchWithTimeout(url, options, ms = 10000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try{
      return await fetch(url, { ...(options || {}), signal: controller.signal });
    }catch(err){
      if(err.name === 'AbortError') throw new Error('Request timed out after ' + (ms/1000) + 's');
      throw err;
    }finally{
      clearTimeout(timer);
    }
  }

  const WMO = {
    0:'Clear sky', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Fog', 48:'Rime fog',
    51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain',
    71:'Light snow', 73:'Snow', 75:'Heavy snow',
    80:'Light showers', 81:'Showers', 82:'Heavy showers',
    95:'Thunderstorm', 96:'Thunderstorm with hail', 99:'Severe thunderstorm'
  };
  const SVG_ICONS = {
    sun: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
    partly: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="7" r="3" fill="#fbbf24"/><path d="M8 1.5v1.6M8 12v0M1.5 7h1.6M3.3 2.3l1.1 1.1M12.7 2.3l-1.1 1.1" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/><path d="M7 20h9.5a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 6.6 13.3 3.5 3.5 0 0 0 7 20z" fill="#a1a1aa"/></svg>',
    cloud: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M6 19h11a4 4 0 0 0 .6-7.96 5.5 5.5 0 0 0-10.79 1.38A3.5 3.5 0 0 0 6 19z" fill="#a1a1aa"/></svg>',
    fog: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round"><path d="M6 11h11a3.5 3.5 0 0 0 0-7 4.8 4.8 0 0 0-9.1 1.3A3 3 0 0 0 6 11z" fill="#71717a" stroke="none" opacity=".7"/><path d="M3 15h18M5 19h14"/></svg>',
    rain: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"><path d="M6 11h11a3.5 3.5 0 0 0 0-7 4.8 4.8 0 0 0-9.1 1.3A3 3 0 0 0 6 11z" fill="#a1a1aa" stroke="none"/><path d="M8 15l-1.5 3M13 15l-1.5 3M18 15l-1.5 3"/></svg>',
    snow: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#e4e4e7" stroke-width="1.5" stroke-linecap="round"><path d="M6 11h11a3.5 3.5 0 0 0 0-7 4.8 4.8 0 0 0-9.1 1.3A3 3 0 0 0 6 11z" fill="#a1a1aa" stroke="none"/><path d="M8 15v4M6 16.5l4 1M10 16.5l-4 1M16 15v4M14 16.5l4 1M18 16.5l-4 1"/></svg>',
    storm: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M6 11h11a3.5 3.5 0 0 0 0-7 4.8 4.8 0 0 0-9.1 1.3A3 3 0 0 0 6 11z" fill="#71717a"/><path d="M12 12l-3 5h3l-1 4 4-6h-3l1-3z" fill="#fbbf24"/></svg>'
  };
  const WMO_ICON = {
    0:'sun', 1:'sun', 2:'partly', 3:'cloud',
    45:'fog', 48:'fog',
    51:'rain', 53:'rain', 55:'rain',
    61:'rain', 63:'rain', 65:'rain',
    71:'snow', 73:'snow', 75:'snow',
    80:'rain', 81:'rain', 82:'storm',
    95:'storm', 96:'storm', 99:'storm'
  };

  // Small circular refresh icon in the tile header, replacing the old big
  // text "Refresh" buttons. Spins briefly on click for feedback.
  const REFRESH_ICON_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>`;

  function addRefreshIcon(mod, onRefresh){
    const tile = document.querySelector(`[data-module="${mod}"]`);
    const right = tile.querySelector('.tile-head-right');
    if(!right || right.querySelector('.icon-refresh-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'icon-refresh-btn';
    btn.title = 'Refresh';
    btn.setAttribute('aria-label', 'Refresh');
    btn.innerHTML = REFRESH_ICON_SVG;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      btn.classList.add('spinning');
      setTimeout(() => btn.classList.remove('spinning'), 500);
      onRefresh();
    });
    right.appendChild(btn);
  }

  async function connectWeather(){
    const tile = document.querySelector('[data-module="weather"]').closest('.tile');
    const stateEl = tile.querySelector('.tile-state');
    const bodyEl = tile.querySelector('.tile-body');
    const btn = tile.querySelector('button[data-module="weather"]');
    stateEl.textContent = 'Connecting…';
    stateEl.classList.remove('off');
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
      const res = await fetchWithTimeout(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const cur = data.current;
      const desc = WMO[cur.weather_code] || 'Unknown conditions';
      const iconKey = WMO_ICON[cur.weather_code] || 'cloud';
      const iconSvg = SVG_ICONS[iconKey];
      const tmax = Math.round(data.daily.temperature_2m_max[0]);
      const tmin = Math.round(data.daily.temperature_2m_min[0]);

      stateEl.textContent = 'Live — ' + LOCATION.name;
      bodyEl.innerHTML = `
        <div style="display:flex; align-items:center; gap:16px;">
          <span style="display:inline-flex; width:44px; height:44px; flex-shrink:0;">${iconSvg}</span>
          <div style="display:flex; align-items:baseline; gap:10px;">
            <span style="font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--text);">${Math.round(cur.temperature_2m)}°</span>
            <span style="font-size:13px; color:var(--text-mid);">feels like ${Math.round(cur.apparent_temperature)}°</span>
          </div>
        </div>
        <div class="tile-hint">${desc} · wind ${Math.round(cur.wind_speed_10m)} km/h</div>
        <div class="tile-hint" style="color:var(--text-dim);">day ${tmax}° / night ${tmin}°</div>
      `;
      btn.style.display = 'none';
      addRefreshIcon('weather', connectWeather);

      connected.add('weather');
      refreshCount();
    }catch(err){
      stateEl.textContent = 'Connection error';
      bodyEl.querySelector('.tile-hint') && (bodyEl.querySelector('.tile-hint').textContent = 'Will retry on next load.');
      console.error('weather fetch failed', err);
    }
  }

  // ---- city search (Open-Meteo geocoding, no key needed) ----
  async function geocodeCitySuggestions(query){
    try{
      const res = await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`, null, 6000);
      if(!res.ok) return [];
      const data = await res.json();
      if(!data.results) return [];
      return data.results.map(r => ({
        name: r.name,
        region: [r.admin1, r.country].filter(Boolean).join(', '),
        lat: r.latitude,
        lon: r.longitude
      }));
    }catch(err){
      console.warn('suggestion fetch failed', err);
      return [];
    }
  }

  async function geocodeCity(query){
    let lastErr = null;
    // Primary: Open-Meteo geocoding (no key, CORS-enabled)
    try{
      const res = await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
      if(res.ok){
        const data = await res.json();
        if(data.results && data.results.length){
          const r = data.results[0];
          return { name: r.name + (r.country_code ? ', ' + r.country_code : ''), lat: r.latitude, lon: r.longitude };
        }
      } else {
        lastErr = new Error('Open-Meteo returned HTTP ' + res.status);
      }
    }catch(err){ lastErr = err; console.warn('Open-Meteo geocoding failed, trying fallback:', err); }

    // Fallback: Nominatim / OpenStreetMap (no key, widely CORS-friendly)
    try{
      const res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
      if(res.ok){
        const data = await res.json();
        if(data && data.length){
          const r = data[0];
          return { name: r.display_name.split(',')[0], lat: parseFloat(r.lat), lon: parseFloat(r.lon) };
        }
      } else {
        lastErr = new Error('Nominatim returned HTTP ' + res.status);
      }
    }catch(err){ lastErr = err; console.warn('Nominatim geocoding failed too:', err); }

    return { error: lastErr };
  }

  let cityMsgTimer = null;
  async function searchCity(query){
    const msg = document.getElementById('citySearchMsg');
    const btn = document.getElementById('citySearchBtn');
    if(!query) return;
    clearTimeout(cityMsgTimer);
    msg.style.display = 'block';
    msg.style.color = 'var(--text-dim)';
    msg.textContent = 'Searching for "' + query + '"…';
    btn.textContent = '…';
    btn.disabled = true;

    const result = await geocodeCity(query);

    btn.textContent = 'Search';
    btn.disabled = false;

    if(!result || !result.lat){
      msg.style.color = 'var(--rose-bright)';
      if(result && result.error){
        msg.textContent = 'City search failed: ' + (result.error.message || String(result.error)) + '.';
      } else {
        msg.textContent = 'City not found — check spelling.';
      }
      console.error('geocoding produced no usable result for', query, result);
      clearTimeout(cityMsgTimer);
      cityMsgTimer = setTimeout(() => { msg.style.display = 'none'; }, 4000);
      return;
    }

    msg.style.color = 'var(--text-dim)';
    msg.textContent = 'Found ' + result.name + ' (' + result.lat.toFixed(2) + ', ' + result.lon.toFixed(2) + ') — updating weather…';
    console.log('geocoded', query, '→', result);

    LOCATION.name = result.name;
    LOCATION.lat = result.lat;
    LOCATION.lon = result.lon;
    document.getElementById('citySearchInput').value = '';
    await connectWeather();
    msg.style.display = 'none';
    recenterRadar(result.lat, result.lon);
    if(document.getElementById('radarModalBackdrop').classList.contains('show')) loadPrecipOutlook();
  }

  // ---- rain radar (Leaflet + RainViewer tiles, no key needed) ----
  // Real MeteoSwiss radar files are raw HDF5 and need a backend to decode;
  // RainViewer gives live global radar imagery (incl. Switzerland) as simple
  // map tiles that work directly in the browser. Zoom caps below (maxNativeZoom:7,
  // maxZoom:12) match RainViewer's own reference implementation — radar tiles
  // aren't rendered past native zoom 7, so Leaflet upscales instead of requesting
  // unsupported levels (that's what caused the earlier "zoom level not supported").
  let radarMapInstance = null, radarLayer = null, radarMarker = null;
  let radarFrames = [], radarFrameIdx = 0, radarTimer = null, rainviewerHost = '';

  let leafletLoadPromise = null;
  function ensureLeaflet(){
    if(window.L) return Promise.resolve();
    if(leafletLoadPromise) return leafletLoadPromise;
    leafletLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Leaflet script failed to load'));
      document.head.appendChild(s);
    });
    return leafletLoadPromise;
  }

  async function openRadarModal(){
    const backdrop = document.getElementById('radarModalBackdrop');
    const box = document.getElementById('radarModalMap');
    backdrop.classList.add('show');
    loadPrecipOutlook();
    try{
      await ensureLeaflet();
      if(!radarMapInstance){
        box.innerHTML = '';
        radarMapInstance = L.map('radarModalMap', { attributionControl:true, maxZoom:12, minZoom:3 })
          .setView([LOCATION.lat, LOCATION.lon], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: 'abcd',
          maxZoom: 12
        }).addTo(radarMapInstance);

      }

  async function loadRadarFrames(){
    try{
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await res.json();
      rainviewerHost = data.host;
      // RainViewer's free public API only returns past frames (confirmed in their own
      // docs: "no forecast/nowcast" on the free tier) — data.radar.nowcast will be empty
      // here. The 24h outlook below covers future rain instead, using forecast-model data.
      radarFrames = [...(data.radar.past || []), ...(data.radar.nowcast || [])].slice(-12);
      radarFrameIdx = radarFrames.length - 1;
      const slider = document.getElementById('radarSlider');
      slider.max = radarFrames.length - 1;
      slider.value = radarFrameIdx;
      showRadarFrame(radarFrameIdx);
    }catch(err){
      console.error('rainviewer fetch failed', err);
      const label = document.getElementById('radarFrameLabel');
      if(label) label.textContent = 'Unavailable';
    }
  }

  function showRadarFrame(idx){
    if(!radarFrames[idx] || !radarMapInstance) return;
    radarFrameIdx = idx;
    const frame = radarFrames[idx];
    const url = `${rainviewerHost}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
    if(radarLayer) radarMapInstance.removeLayer(radarLayer);
    radarLayer = L.tileLayer(url, { opacity:0.7, zIndex:5, maxNativeZoom:7, maxZoom:12 }).addTo(radarMapInstance);
    const slider = document.getElementById('radarSlider');
    if(slider) slider.value = idx;
    const label = document.getElementById('radarFrameLabel');
    if(label){
      const d = new Date(frame.time * 1000);
      label.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }
  }

    const btn = document.getElementById('radarPlayBtn');

  // Radar imagery itself only extrapolates ~30-60min into the future (nowcast).
  // For a genuine 24h outlook we use Open-Meteo's forecast model instead.
  async function loadPrecipOutlook(){
    const el = document.getElementById('precipOutlook');
    const summaryEl = document.getElementById('precipSummary');
    el.innerHTML = '';
    if(summaryEl) summaryEl.textContent = 'Loading…';
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&hourly=precipitation_probability,precipitation&forecast_hours=24&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const times = data.hourly.time;
      const probs = data.hourly.precipitation_probability;
      const amounts = data.hourly.precipitation;

      // Plain-language summary: find the first stretch where rain is likely
      if(summaryEl){
        let firstIdx = -1, lastIdx = -1;
        for(let i = 0; i < probs.length; i++){
          if(probs[i] >= 50){
            if(firstIdx === -1) firstIdx = i;
            lastIdx = i;
          }
        }
        if(firstIdx === -1){
          summaryEl.textContent = 'No significant rain expected in the next 24h.';
        } else {
          const fmt = (i) => new Date(times[i]).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          summaryEl.textContent = 'Rain likely between ' + fmt(firstIdx) + ' and ' + fmt(lastIdx) + '.';
        }
      }

      el.innerHTML = times.map((t, i) => {
        const pct = probs[i] || 0;
        const mm = amounts[i] || 0;
        const hour = new Date(t).getHours();
        const showLabel = i % 4 === 0;
        return `
          <div class="precip-bar-col">
            <div class="precip-bar" style="height:${Math.max(pct, 2)}%;" title="${pct}% · ${mm}mm"></div>
            ${showLabel ? `<div class="precip-bar-hour">${hour}h</div>` : ''}
          </div>`;
      }).join('');
    }catch(err){
      console.error('precip outlook failed', err);
      if(summaryEl) summaryEl.textContent = '';
      el.innerHTML = '<div class="tile-hint" style="color:var(--text-dim);">Outlook unavailable.</div>';
    }
  }

      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
      body: JSON.stringify({
        model: model,
        messages: chatHistory.map(m => ({ role: m.role, content: m.text }))
      })
    }, 20000);
    const data = await res.json();
    if(!res.ok){
      const err = new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!reply) throw new Error('Empty response from Groq.');
    return reply;
  }

  async function callGemini(){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    const res = await fetchWithTimeout(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY },
      body: JSON.stringify({
        contents: chatHistory.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.text }] }))
      })
    }, 20000);
    const data = await res.json();
    if(!res.ok){
      const err = new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    const reply = data.candidates && data.candidates[0] && data.candidates[0].content
      && data.candidates[0].content.parts && data.candidates[0].content.parts.map(p => p.text || '').join('');
    if(!reply) throw new Error('Empty response from Gemini.');
    return reply;
  }

  function isRetryable(err){
    return err.status === 503 || err.status === 429 || /high demand|overloaded|quota|no longer available/i.test(err.message || '');
  }

  async function askAI(thinkingEl){
    const providers = [];
    if(GROQ_API_KEY){
      GROQ_MODELS.forEach(m => providers.push({ name: m + ' (Groq)', call: () => callGroq(m) }));
    }
    providers.push({ name: GEMINI_MODEL + ' (Gemini)', call: callGemini });

    let lastErr;
    for(let i = 0; i < providers.length; i++){
      try{
        return await providers[i].call();
      }catch(err){
        lastErr = err;
        console.error(providers[i].name + ' failed:', err);
        if(!isRetryable(err) && i === providers.length - 1) throw err;
        if(i < providers.length - 1 && thinkingEl){
          thinkingEl.textContent = providers[i].name + ' failed: ' + err.message + ' — trying ' + providers[i+1].name + '…';
        }
      }
    }
    throw lastErr;
  }

  async function sendChatMessage(){
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('chatSendBtn');
    const text = input.value.trim();
    if(!text) return;

    addChatMessage('user', text);
    chatHistory.push({ role: 'user', text });
    input.value = '';
    btn.disabled = true;
    const thinking = addChatMessage('assistant', '…');

    try{
      const reply = await askAI(thinking);
      if(window.marked) thinking.innerHTML = marked.parse(reply); else thinking.textContent = reply;
      chatHistory.push({ role: 'assistant', text: reply });
    }catch(err){
      thinking.remove();
      addChatMessage('system', 'AI request failed: ' + err.message);
      console.error('chat failed', err);
      chatHistory.pop(); // drop the unanswered user turn so retry doesn't duplicate context
    }
    btn.disabled = false;
    // no auto-focus here — focusing an input can trigger the browser's
    // own scroll-into-view behavior, which is what was moving the page
  }

  // ---- chat panel resize (drag the left edge) ----
  (function setupChatPanelResize(){
    const panel = document.getElementById('chatPanel');
    const handle = document.getElementById('chatPanelResize');
    const MIN_W = 300, MAX_W = 720;

    const savedWidth = parseInt(localStorage.getItem('chat_panel_width'), 10);
    if(savedWidth && savedWidth >= MIN_W && savedWidth <= MAX_W){
      panel.style.width = savedWidth + 'px';
    }

    let dragging = false, startX = 0, startWidth = 0;

    handle.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX;
      startWidth = panel.getBoundingClientRect().width;
      panel.classList.add('resizing');
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if(!dragging) return;
      const delta = startX - e.clientX; // dragging left = wider (panel anchored right)
      let newWidth = startWidth + delta;
      newWidth = Math.max(MIN_W, Math.min(MAX_W, newWidth));
      panel.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if(!dragging) return;
      dragging = false;
      panel.classList.remove('resizing');
      document.body.style.userSelect = '';
      localStorage.setItem('chat_panel_width', Math.round(panel.getBoundingClientRect().width));
    });
  })();

    function wireStationAutocomplete(inputId, suggBoxId){
      const input = document.getElementById(inputId);
      const box = document.getElementById(suggBoxId);
      let debounceTimer = null;
      input.addEventListener('input', () => {
        const q = input.value.trim();
        clearTimeout(debounceTimer);
        if(q.length < 2){ box.classList.remove('show'); return; }
        debounceTimer = setTimeout(async () => {
          try{
            const res = await fetchWithTimeout(`https://transport.opendata.ch/v1/locations?query=${encodeURIComponent(q)}&type=station`, null, 6000);
            const data = await res.json();
            const stations = (data.stations || []).filter(s => s.id).slice(0, 6);
            if(!stations.length){ box.classList.remove('show'); return; }
            box.innerHTML = stations.map((s, i) => `
              <div class="city-suggestion" data-idx="${i}"><span class="cs-name">${s.name}</span></div>
            `).join('');
            box.classList.add('show');
            box.querySelectorAll('.city-suggestion').forEach((el, i) => {
              el.addEventListener('click', (e) => {
                e.stopPropagation();
                input.value = stations[i].name;
                box.classList.remove('show');
              });
            });
          }catch(err){ console.error('transit location search failed', err); }

    async function searchTransit(){
      const from = document.getElementById('transitFrom').value.trim();
      const to = document.getElementById('transitTo').value.trim();
      const date = document.getElementById('transitDate').value;
      const time = document.getElementById('transitTime').value;
      const btn = document.getElementById('transitSearchBtn');

      if(!from || !to){
        showTransitMsg('Enter both a departure and destination.');
        return;
      }

      btn.textContent = 'Searching…';
      btn.disabled = true;
      try{
        const params = new URLSearchParams({ from, to, limit: 4 });
        if(date) params.set('date', date);
        if(time) params.set('time', time);
        const res = await fetchWithTimeout('https://transport.opendata.ch/v1/connections?' + params.toString(), null, 10000);
        const data = await res.json();
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const connections = data.connections || [];
        if(!connections.length){
          showTransitMsg('No connections found.');
        } else {
          openTransitModal(connections, from, to);
        }
      }catch(err){
        console.error('transit search failed', err);
        showTransitMsg('Search failed: ' + err.message);
      }
      btn.textContent = 'Search';
      btn.disabled = false;
    }

    document.getElementById('transitSearchBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      searchTransit();
    });
  }

  // Rough CHF estimate from straight-line distance between first departure and
  // last arrival. Real SBB fares use a zone/distance model this open API doesn't
  // expose — this is a ballpark only, labeled as such, not a bookable price.
  // Official SBB deep-linking format (per SBB's own community-documented guide) —
  // opens sbb.ch with this exact route/time pre-filled so real pricing can be checked.
  function sbbDeepLink(fromName, toName, isoDatetime){
    const d = new Date(isoDatetime);
    const datum = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
    const zeit = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    const params = new URLSearchParams({ von: fromName, nach: toName, datum, zeit, suche: 'true' });
    return 'https://www.sbb.ch/en/buying/pages/fahrplan/fahrplan.xhtml?' + params.toString();
  }

  function estimateFareCHF(connection){
    const sections = (connection.sections || []).filter(s => s.departure && s.arrival);
    if(!sections.length) return null;
    const first = sections[0].departure.station;
    const last = sections[sections.length - 1].arrival.station;
    if(!first || !last || !first.coordinate || !last.coordinate) return null;
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(last.coordinate.x - first.coordinate.x);
    const dLon = toRad(last.coordinate.y - first.coordinate.y);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(first.coordinate.x)) * Math.cos(toRad(last.coordinate.x)) * Math.sin(dLon/2)**2;
    const distKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const fare = 3 + distKm * 0.31; // base fare + rough per-km rate, 2nd class, no discount card
    return Math.round(fare);
  }

  function renderTransitConnections(connections, fromName, toName){
    const body = document.getElementById('transitModalBody');
    body.innerHTML = connections.map((c, i) => {
      const dep = new Date(c.from.departure).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      const arr = new Date(c.to.arrival).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      const durMatch = (c.duration || '').match(/(\d+)d(\d+):(\d+)/);
      let durationStr = c.duration || '';
      if(durMatch){
        const hours = parseInt(durMatch[2], 10) + parseInt(durMatch[1], 10) * 24;
        durationStr = (hours ? hours + 'h ' : '') + durMatch[3] + 'm';
      }
      const transferCount = c.transfers || 0;
      const transfersStr = transferCount === 0 ? 'Direct' : transferCount + (transferCount === 1 ? ' transfer' : ' transfers');
      const fare = estimateFareCHF(c);
      const sbbUrl = sbbDeepLink(fromName, toName, c.from.departure);
      const legs = (c.sections || []).filter(s => s.journey || s.walk).map(s => {
        if(s.walk) return `<div class="transit-leg"><div class="transit-leg-dot"></div>Walk${s.walk.duration ? ' · ' + Math.round(s.walk.duration/60) + ' min' : ''}</div>`;
        const line = s.journey ? ((s.journey.category || '') + (s.journey.number || '')) : '';
        const depName = s.departure && s.departure.station ? s.departure.station.name : '';
        const arrName = s.arrival && s.arrival.station ? s.arrival.station.name : '';
        return `<div class="transit-leg"><div class="transit-leg-dot"></div>${line} ${depName} → ${arrName}</div>`;
      }).join('');
      return `
        <div class="transit-conn" data-conn-idx="${i}">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--text);">${dep} → ${arr}</div>
            <div style="text-align:right;">
              <div style="font-size:11px; color:var(--text-dim);">${durationStr} · ${transfersStr}</div>
              ${fare ? `<div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);">~CHF ${fare} est.</div>` : ''}
            </div>
          </div>
          <div style="margin-top:4px;">${legs}</div>
          <a href="${sbbUrl}" target="_blank" rel="noopener" class="transit-sbb-link" style="display:inline-block; margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--rose-bright);">Check real price on SBB.ch →</a>
        </div>`;
    }).join('') + `<div class="tile-hint" style="margin-top:10px; color:var(--text-dim); font-size:10px;">CHF figures above are rough distance estimates, not real fares. Click "Check real price on SBB.ch" on any connection for the actual cost.</div>`;

    body.querySelectorAll('.transit-conn').forEach(el => {
      el.addEventListener('click', (e) => {
        if(e.target.closest('.transit-sbb-link')) return; // let the link open normally
        showTransitRouteOnMap(connections[Number(el.dataset.connIdx)]);
      });
    });
  }

  let transitMapInstance = null;
  async function showTransitRouteOnMap(connection){
    const mapEl = document.getElementById('transitModalMap');
    try{
      await ensureLeaflet();
      const points = [];
      (connection.sections || []).forEach(s => {
        if(s.departure && s.departure.station && s.departure.station.coordinate && s.departure.station.coordinate.x){
          points.push({ lat: s.departure.station.coordinate.x, lon: s.departure.station.coordinate.y, name: s.departure.station.name });
        }
        if(s.arrival && s.arrival.station && s.arrival.station.coordinate && s.arrival.station.coordinate.x){
          points.push({ lat: s.arrival.station.coordinate.x, lon: s.arrival.station.coordinate.y, name: s.arrival.station.name });
        }
      });
      if(!points.length){
        mapEl.innerHTML = '<div class="radar-placeholder">No map data for this route.</div>';
        return;
      }
      mapEl.innerHTML = '';
      if(transitMapInstance){ transitMapInstance.remove(); transitMapInstance = null; }
      transitMapInstance = L.map('transitModalMap').setView([points[0].lat, points[0].lon], 9);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
      }).addTo(transitMapInstance);
      const latlngs = points.map(p => [p.lat, p.lon]);
      L.polyline(latlngs, { color:'#e11d48', weight:3 }).addTo(transitMapInstance);
      points.forEach(p => L.marker([p.lat, p.lon]).addTo(transitMapInstance).bindPopup(p.name));
      transitMapInstance.fitBounds(latlngs, { padding:[24,24] });
      setTimeout(() => { transitMapInstance && transitMapInstance.invalidateSize(); }, 100);
    }catch(err){
      console.error('transit map failed', err);
      mapEl.innerHTML = '<div class="radar-placeholder" style="color:var(--rose-bright);">Map failed to load.</div>';
    }
  }

  function openTransitModal(connections, from, to){
    document.getElementById('transitModalTitle').textContent = from.toUpperCase() + ' → ' + to.toUpperCase();
    renderTransitConnections(connections, from, to);
    document.getElementById('transitModalBackdrop').classList.add('show');
    showTransitRouteOnMap(connections[0]);
  }

  function closeTransitModal(){
    document.getElementById('transitModalBackdrop').classList.remove('show');
  }
  document.getElementById('transitModalClose').addEventListener('click', closeTransitModal);
  document.getElementById('transitModalBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'transitModalBackdrop') closeTransitModal();
  });

  augmentTransitTile();
</script>

</body>
