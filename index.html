<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAV / ASSISTANT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css">
<script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<style>
  :root{
    --bg: #09090b;
    --bg-raised: #161618;
    --line: #2c2c31;
    --rose: #9f1239;
    --rose-bright: #e11d48;
    --text: #f4f4f5;
    --text-dim: #71717a;
    --text-mid: #a1a1aa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    min-height:100%;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(225,29,72,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(56,189,248,.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--rose); color:#fff; }

  .ambient-bg{
    position:fixed; inset:0;
    pointer-events:none;
    overflow:hidden;
    /* isolate this layer from the rest of the page so unrelated updates
       elsewhere (e.g. the clock ticking every second) never force a
       repaint of the expensive blur below */
    transform:translateZ(0);
    contain:strict;
  }
  .ambient-blob{
    position:absolute;
    width:38vw; height:38vw;
    border-radius:50%;
    filter:blur(60px);
    opacity:.10;
    transform:translateZ(0);
  }
  .ambient-blob:nth-child(1){
    background:var(--rose);
    top:-10%; left:-8%;
  }
  .ambient-blob:nth-child(2){
    background:#2dd4bf;
    bottom:-15%; right:-10%;
  }
  .ambient-blob:nth-child(3){
    background:#fbbf24;
    top:35%; left:55%;
    width:28vw; height:28vw;
    opacity:.06;
  }

  /* ---------- BOOT ---------- */
  #boot{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    z-index:100;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #boot.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  #boot-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.25em;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  /* ---------- SHELL ---------- */
  #shell{
    min-height:100%;
    display:flex; flex-direction:column;
    opacity:0;
    transition:opacity .7s ease;
  }
  #shell.show{ opacity:1; }

  header{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    overflow:hidden;
  }
  .brand{ position:relative; display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    letter-spacing:.06em;
    line-height:1;
  }
  .brand .mark span{ color:var(--rose-bright); }
  .brand .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:.15em;
    text-transform:uppercase;
  }
  .status{ position:relative; display:flex; align-items:center; gap:22px; }

  .quick-links{ position:relative; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .quick-link{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px;
    opacity:.7;
    transition:opacity .15s ease, transform .15s ease;
  }
  .quick-link:hover{ opacity:1; transform:translateY(-1px); }
  .quick-link img{ width:100%; height:100%; object-fit:contain; display:block; border-radius:22%; }
  .quick-link-fallback{
    display:none; width:30px; height:30px; border-radius:50%;
    background:var(--bg-raised); border:1px solid var(--line);
    align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.02em;
    color:var(--text-mid);
  }
  .quick-link.fallback img{ display:none; }
  .quick-link.fallback .quick-link-fallback{ display:flex; }
  @media (max-width: 900px){ .quick-links{ display:none; } }

  .tz-clocks{ display:flex; align-items:center; gap:16px; padding-right:16px; border-right:1px solid var(--line); }
  .tz-clock{ text-align:right; font-family:'JetBrains Mono', monospace; line-height:1.3; }
  .tz-clock .tz-time{ font-size:13px; color:var(--text-mid); }
  .tz-clock .tz-label{ font-size:9px; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase; }
  @media (max-width: 900px){ .tz-clocks{ display:none; } }

  /* Explicit mobile-mode toggle - same effect as the width-based media
     queries above, but forced on regardless of actual viewport width, and
     with additional touch-friendly adjustments GridStack alone doesn't cover. */
  body.mobile-mode .quick-links,
  body.mobile-mode .tz-clocks{ display:none; }
  body.mobile-mode .chat-panel{ width:100vw !important; max-width:100vw; }
  body.mobile-mode .grid-stack-item{ width:100% !important; left:0 !important; }
  body.mobile-mode .tile{ min-height:auto; }
  body.mobile-mode .modal-panel{ width:96vw !important; }
  #layoutModeToggleBtn.mobile-active{ color:var(--rose-bright); border-color:var(--rose-bright); background:rgba(225,29,72,.1); }

  .clock{
    font-family:'JetBrains Mono', monospace;
    text-align:right;
    line-height:1.3;
  }
  .clock .time{ font-size:15px; color:var(--text); }
  .clock .date{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; }
  .live{ display:flex; align-items:center; gap:7px; }
  .live .dot{
    position:relative;
    width:7px; height:7px; border-radius:50%;
    background:var(--rose-bright);
  }
  .live .dot::after{
    content:'';
    position:absolute; inset:0;
    border-radius:50%;
    background:var(--rose-bright);
    animation:pulse 2s infinite;
    will-change:transform, opacity;
  }
  .live .txt{
    font-family:'JetBrains Mono', monospace;
    font-size:9px; letter-spacing:.2em;
    color:var(--text-dim); text-transform:uppercase;
  }
  @keyframes pulse{
    0%{ transform:scale(1); opacity:.6; }
    70%{ transform:scale(2.4); opacity:0; }
    100%{ transform:scale(2.4); opacity:0; }
  }

  main{
    padding:28px 32px 32px;
  }
  .grid-stack{ background:transparent; }
  .grid-stack-item-content{
    inset:0 !important;
    overflow:visible !important;
  }
  .grid-stack-item .tile{
    height:100%;
    margin:0;
  }
  /* theme the resize handles to match the dark UI instead of default gray */
  .grid-stack-item > .ui-resizable-handle{ opacity:0; transition:opacity .15s ease; }
  .grid-stack-item:hover > .ui-resizable-handle{ opacity:1; }
  .grid-stack-item > .ui-resizable-se{
    background: linear-gradient(135deg, transparent 0 40%, var(--rose-bright) 40% 60%, transparent 60% 100%);
    width:14px; height:14px; right:4px; bottom:4px;
  }
  .grid-stack-item.ui-draggable-dragging .tile,
  .grid-stack-item.ui-resizable-resizing .tile{
    border-color:var(--rose-bright);
  }

  .leaflet-container{ background:#0f0f11; font-family:'JetBrains Mono', monospace; }
  .leaflet-control-attribution{ background:rgba(24,24,27,.85)!important; color:var(--text-dim)!important; font-size:9px!important; }
  .leaflet-control-attribution a{ color:var(--text-mid)!important; }
  .leaflet-bar a{ background:var(--bg-raised)!important; color:var(--text)!important; border-color:var(--line)!important; }
  .leaflet-bar a:hover{ background:var(--rose)!important; }

  .radar-modal-map{
    height:60vh;
    min-height:360px;
    width:100%;
    background:#0f0f11;
  }
  .radar-controls{
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
    border-top:1px solid var(--line);
  }
  .radar-controls input[type="range"]{
    flex:1;
    accent-color:var(--rose-bright);
  }
  .radar-controls .tile-idx{ min-width:56px; text-align:right; }

  .precip-outlook-wrap{ padding:12px 20px 18px; border-top:1px solid var(--line); }
  .precip-outlook-label{
    font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:.12em;
    color:var(--text-dim); text-transform:uppercase; margin-bottom:8px;
  }
  .precip-summary{
    font-size:14px; color:var(--text); margin-bottom:10px;
  }

  .city-suggestions{
    display:none;
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:3px;
    max-height:220px;
    overflow-y:auto;
    z-index:20;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .city-suggestions.show{ display:block; }
  .city-suggestion{
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:10px;
  }
  .city-suggestion:last-child{ border-bottom:none; }
  .city-suggestion:hover{ background:var(--bg); }
  .city-suggestion .cs-name{ color:var(--text); }
  .city-suggestion .cs-region{ color:var(--text-dim); font-family:'JetBrains Mono', monospace; font-size:11px; white-space:nowrap; }

  .transit-input{
    background:var(--bg); border:1px solid var(--line); border-radius:3px;
    color:var(--text); padding:7px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:not([type="checkbox"]):not([type="range"]):not([type="file"]):focus,
  select:focus, textarea:focus{
    outline:none;
    border-color:var(--rose-bright) !important;
    box-shadow:0 0 0 3px rgba(225,29,72,.15);
  }
  .transit-input::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; opacity:.7; }
  .transit-leg{ display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12px; color:var(--text-mid); }
  .transit-leg-dot{ width:6px; height:6px; border-radius:50%; background:var(--rose-bright); flex-shrink:0; }
  .transit-conn{ padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; transition:opacity .15s ease; }
  .transit-conn:hover{ opacity:.8; }
  .transit-conn:last-child{ border-bottom:none; }

  .task-input-row{ display:flex; gap:8px; margin:2px 0 8px; }
  .task-board{ display:flex; gap:10px; width:100%; flex:1; min-height:0; }
  .task-column{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .task-column-head{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-dim); padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .task-column-list{
    display:flex; flex-direction:column; gap:6px; flex:1; min-height:60px;
    overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .task-column-list::-webkit-scrollbar{ width:5px; }
  .task-column-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .task-card{
    background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:3px;
    padding:8px 9px; display:flex; flex-direction:column; gap:5px;
  }
  .task-card-text{ font-size:12px; color:var(--text); word-break:break-word; line-height:1.35; }
  .task-column-list#taskListDone .task-card-text{ color:var(--text-dim); text-decoration:line-through; }
  .task-card-deadline{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-dim); }
  .task-card-deadline.overdue{ color:var(--rose-bright); }
  .task-card-controls{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .task-card-moves{ display:flex; gap:4px; }
  .task-move-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    width:20px; height:20px; border-radius:3px; cursor:pointer; font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:color .15s ease, border-color .15s ease;
  }
  .task-move-btn:hover{ color:var(--rose-bright); border-color:var(--rose-bright); }
  .task-move-btn:disabled{ opacity:.25; cursor:default; }
  .task-move-btn:disabled:hover{ color:var(--text-dim); border-color:var(--line); }
  .task-card-remove{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-size:14px; line-height:1; padding:0 2px;
    transition:color .15s ease;
  }
  .task-card-remove:hover{ color:var(--rose-bright); }
  .transit-sbb-link:hover{ text-decoration:underline; }
  .transit-mode-toggle{ display:flex; gap:6px; margin-bottom:2px; }
  .transit-mode-btn{
    flex:1; background:var(--bg); border:1px solid var(--line); border-radius:3px;
    color:var(--text-dim); padding:6px 8px; cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .transit-mode-btn:hover{ color:var(--text); }
  .transit-mode-btn.active{ color:var(--rose-bright); border-color:var(--rose-bright); background:rgba(225,29,72,.1); }

  .conv-result-card{
    width:100%; margin-top:8px; padding:14px 16px;
    background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:3px;
  }
  .conv-equation-line{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-dim); margin-bottom:4px; }
  .conv-result-value{ font-family:'JetBrains Mono', monospace; font-size:28px; color:var(--text); }

  .conv-file-picker{ display:flex; align-items:center; gap:10px; }
  .conv-file-input-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .conv-file-btn{ margin-top:0; flex-shrink:0; }
  .conv-file-label{ font-size:12px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }

  .conv-download-icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; flex-shrink:0;
    background:none; border:1px solid var(--rose); color:var(--rose-bright);
    border-radius:3px; cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  .conv-download-icon-btn:hover{ background:var(--rose-bright); color:#18181b; border-color:var(--rose-bright); }
  .conv-download-icon-btn:active{ transform:scale(.92); }

  .conv-progress-wrap{
    width:100%; height:5px; border-radius:3px;
    background:rgba(255,255,255,.06); overflow:hidden;
  }
  .conv-progress-fill{
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg, var(--rose), var(--rose-bright));
    transition:width .2s ease;
  }

  .tile-center-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
    pointer-events:none;
    min-height:0; min-width:0;
  }
  .tile-center-overlay > *{ pointer-events:auto; }

  .tap-circle{
    width:100px; max-width:70%; max-height:100%; aspect-ratio:1; border-radius:50%; flex-shrink:1;
    background:var(--rose); border:2px solid var(--rose-bright);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; color:#fff;
    transition:transform .1s ease, background .15s ease, box-shadow .15s ease;
  }
  .tap-circle:hover{ background:var(--rose-bright); box-shadow:0 0 20px rgba(225,29,72,.4); }
  .tap-circle:active{ transform:scale(.93); }
  .tap-bpm-value{ font-family:'JetBrains Mono', monospace; font-size:20px; line-height:1; }
  .tap-bpm-label{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; opacity:.8; margin-top:3px; }

  .weather-stats-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px 10px;
    width:100%;
    flex:1;
    align-content:center;
  }
  .weather-stat{ display:flex; flex-direction:column; gap:1px; }
  .weather-stat-label{ font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:.05em; color:var(--text-dim); text-transform:uppercase; }
  .weather-stat-value{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text); }

  .timer-play-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    background:var(--rose); border:2px solid var(--rose-bright); color:#fff;
    cursor:pointer; transition:background .15s ease, transform .1s ease;
  }
  .timer-play-btn svg{ margin-left:1px; }
  .timer-play-btn:hover{ background:var(--rose-bright); }
  .timer-play-btn:active{ transform:scale(.9); }
  .timer-preset-btn{
    background:var(--bg); border:1px solid var(--line); color:var(--text-dim);
    padding:4px 8px; font-size:10px; border-radius:3px; cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .timer-preset-btn:hover{ color:var(--text); }
  .timer-preset-btn.active{ color:var(--rose-bright); border-color:var(--rose-bright); background:rgba(225,29,72,.1); }

  .live-feed-section{ width:100%; padding-top:10px; margin-top:10px; border-top:1px solid var(--line); }
  .live-feed-row{ display:flex; gap:8px; margin-bottom:8px; }
  .live-feed-frame-wrap{ position:relative; width:100%; padding-top:56.25%; max-height:200px; background:#000; border-radius:3px; overflow:hidden; }
  .live-feed-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .tile[data-module="news"]{ overflow:hidden; display:flex; flex-direction:column; }
  .tile[data-module="news"] .tile-body{ flex:1 1 130px; min-height:0; max-height:2000px; }
  .tile[data-module="news"] .live-feed-section{ flex-shrink:0; }

  .tile[data-module="agenda"]{
    overflow-y:auto; overflow-x:hidden;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .tile[data-module="agenda"]::-webkit-scrollbar{ width:6px; }
  .tile[data-module="agenda"]::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .tile[data-module="agenda"] .tile-body{ max-height:none; overflow:visible; }
  .cal-next3{ width:100%; }
  .cal-next3-item{ display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--line); }
  .cal-next3-item:last-child{ border-bottom:none; }
  .cal-header{ display:flex; align-items:center; justify-content:space-between; width:100%; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .cal-nav-btn{ background:none; border:1px solid var(--line); color:var(--text-mid); width:24px; height:24px; border-radius:3px; cursor:pointer; font-size:14px; line-height:1; }
  .cal-nav-btn:hover{ border-color:var(--rose-bright); color:var(--rose-bright); }
  .cal-month-label{ font-family:'Bebas Neue', sans-serif; font-size:15px; letter-spacing:.04em; color:var(--text); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:3px; width:100%; margin-top:8px; box-sizing:border-box; }
  .cal-dow{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-dim); text-transform:uppercase; padding-bottom:4px; }
  .cal-day{
    width:100%; max-width:28px; max-height:28px; aspect-ratio:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin:0 auto;
    border-radius:3px; font-size:11px; color:var(--text-mid); cursor:default; position:relative;
    background:rgba(255,255,255,.02); box-sizing:border-box; overflow:hidden;
  }
  .cal-day.empty{ background:none; }
  .cal-day.today{ background:var(--rose); color:#fff; font-weight:600; }
  .cal-day.has-events{ cursor:pointer; color:var(--text); }
  .cal-day.has-events:hover{ background:rgba(255,255,255,.08); }
  .cal-day.today.has-events:hover{ background:var(--rose-bright); }
  .cal-day-dot{ width:4px; height:4px; border-radius:50%; background:var(--rose-bright); margin-top:2px; }
  .cal-day.today .cal-day-dot{ background:#fff; }
  .cal-day-events{ width:100%; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .news-resize-handle{
    width:100%; height:10px; margin:2px 0 -2px;
    cursor:ns-resize; position:relative; flex-shrink:0;
  }
  .news-resize-handle::before{
    content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:36px; height:3px; border-radius:3px; background:var(--line);
    transition:background .15s ease;
  }
  .news-resize-handle:hover::before{ background:var(--rose-bright); }
  .precip-outlook{ display:flex; align-items:flex-end; gap:3px; height:56px; }

  .tile[data-module="agenda"]    { --module-accent:#a78bfa; }
  .tile[data-module="markets"]   { --module-accent:#4ade80; }
  .tile[data-module="news"]      { --module-accent:#22d3ee; }

  .tile[data-module="transit"]   { --module-accent:#fb923c; }
  .tile[data-module="converter"]  { --module-accent:#2dd4bf; }
  .tile[data-module="timer"]     { --module-accent:#f472b6; }
  .tile[data-module="qr"]        { --module-accent:#a3e635; }
  .tile[data-module="taptempo"]  { --module-accent:#38bdf8; }

  .tile-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .chat-mic-btn{
    display:inline-flex; align-items:center; justify-content:center;

  }

    letter-spacing:.04em;

  .tile-state{

    display:inline-flex; align-items:center; justify-content:center;

  @keyframes qrPopIn{

  .chat-panel{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw;

  }
  .chat-panel-resize:hover, .chat-panel.resizing .chat-panel-resize{ background:rgba(225,29,72,.25); }
  .chat-panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:14px; border-bottom:1px solid var(--line); flex-shrink:0;
  }

  .chat-messages{

  }
  .chat-msg.assistant pre code{ background:none; padding:0; }
  .chat-msg.assistant table{

  .chat-msg.assistant th, .chat-msg.assistant td{
    border:1px solid rgba(255,255,255,.15); padding:5px 8px; text-align:left;

  .chat-msg.assistant th{ font-family:'JetBrains Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); }
  .chat-msg.assistant a{ color:var(--rose-bright); }
  .chat-msg.assistant blockquote{
    border-left:2px solid var(--rose); margin:0 0 8px; padding-left:10px; color:var(--text-mid);

  .chat-msg.assistant{ align-self:flex-start; background:var(--bg); border:1px solid var(--line); color:var(--text); }

  footer{

  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function tick(){
    const n = new Date();
    timeEl.textContent =
      String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
    dateEl.textContent =
      days[n.getDay()]+' '+String(n.getDate()).padStart(2,'0')+' '+months[n.getMonth()]+' '+n.getFullYear();
  }
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  tick(); setInterval(tick, 1000);

  // ---- timezone clocks (crypto trading session references) ----
  const TZ_CLOCKS = [
    { label: 'New York', tz: 'America/New_York' },
    { label: 'Tokyo', tz: 'Asia/Tokyo' }
  ];
  const tzClocksEl = document.getElementById('tzClocks');
  tzClocksEl.innerHTML = TZ_CLOCKS.map((z, i) => `
    <div class="tz-clock">
      <div class="tz-time" id="tzTime${i}">--:--</div>
      <div class="tz-label">${z.label}</div>
    </div>
  `).join('');
  // Build the formatters and grab the DOM elements once - constructing an
  // Intl.DateTimeFormat is the expensive part of toLocaleTimeString(), and
  // it was silently happening from scratch every single second, forever.
  const tzFormatters = TZ_CLOCKS.map(z => new Intl.DateTimeFormat('en-GB', { timeZone: z.tz, hour:'2-digit', minute:'2-digit' }));
  const tzEls = TZ_CLOCKS.map((z, i) => document.getElementById('tzTime' + i));
  function tickTz(){
    const now = new Date();
    tzFormatters.forEach((fmt, i) => {
      if(tzEls[i]) tzEls[i].textContent = fmt.format(now);
    });
  }
  tickTz(); setInterval(tickTz, 1000);

  // ---- quick links (Simple Icons CDN - free, accurate brand icons, CC0) ----

    { name:'YouTube',      url:'https://youtube.com',      slug:'youtube',      color:'FF0000', short:'YT' },
    { name:'Twitch',       url:'https://twitch.tv',        slug:'twitch',       color:'9146FF', short:'TW' },
    { name:'Instagram',    url:'https://instagram.com',    slug:'instagram',    color:'E4405F', short:'IG' },
    { name:'UFC.TV',       url:'https://ufc.tv',           slug:'ufc',          color:'D20A0A', short:'UFC' },

    { id:'news',     name:'NEWS',       idx:'05', hint:'BBC, CoinDesk, and Attack Magazine headlines.' },

  const converterTile = document.createElement('div');

  grid.appendChild(wrapAsGridItem('converter', converterTile));

  const timerTile = document.createElement('div');

  timerTile.dataset.module = 'timer';
  timerTile.style.position = 'relative';
  timerTile.innerHTML = `
    <div class="tile-head">

    <div class="tile-center-overlay">

  // ---- GridStack init: drag, resize, and persisted layout ----
  const gridStack = GridStack.init({
    column: 12,
    cellHeight: 70,
    margin: 8,
    float: true,
    resizable: { handles: 'se' },
    draggable: { handle: '.tile-head, .chat-left' }
  }, '#grid');

  function saveLayout(){
    try{
      const layout = gridStack.save(false);
      localStorage.setItem('dashboard_layout', JSON.stringify(layout));
    }catch(err){ console.warn('layout save failed', err); }
  }

  const savedLayoutRaw = localStorage.getItem('dashboard_layout');
  if(savedLayoutRaw){
    try{
      gridStack.load(JSON.parse(savedLayoutRaw), false);
    }catch(err){ console.warn('layout load failed, using defaults', err); }

  gridStack.on('change', saveLayout);

  // ---- mobile/desktop layout mode ----
  function applyLayoutMode(mobile){
    document.body.classList.toggle('mobile-mode', mobile);
    document.getElementById('layoutModeToggleBtn').classList.toggle('mobile-active', mobile);
    if(mobile){
      gridStack.column(1, 'list');
      gridStack.disable(); // no drag/resize on touch - avoids accidental drags
    } else {
      gridStack.column(12, 'moveScale');
      gridStack.enable();
    }
  }

  const initialMobile = storedLayoutMode ? storedLayoutMode === 'mobile' : window.innerWidth < 768;

  // Clicking Connect tells you exactly what's missing instead of pretending.
  const NEEDS = {};

  grid.addEventListener('click', (e) => {

    if(mod === 'weather' || mod === 'markets' || mod === 'chat' || mod === 'mail' || mod === 'agenda' || mod === 'news' || mod === 'mastering' || mod === 'transit') return; // already live

      stateEl.classList.remove('off');
      stateEl.style.color = 'var(--rose-bright)';

    if(!noteEl){
      noteEl = document.createElement('div');
      noteEl.className = 'tile-hint tile-need';

  // ---- weather module (Open-Meteo, no key needed) ----
  // Default location: Rolle, VD. Change LOCATION to move it.
  const LOCATION = { name: 'Rolle, VD', lat: 46.4667, lon: 6.3333 };

  // Every fetch in this app should use this — a hung request (bad wifi, a
  // stalled connection) will now fail loudly after 10s instead of leaving
  // a "Loading…" state stuck forever with no way to recover.
  async function fetchWithTimeout(url, options, ms = 10000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try{
      return await fetch(url, { ...(options || {}), signal: controller.signal });
    }catch(err){
      if(err.name === 'AbortError') throw new Error('Request timed out after ' + (ms/1000) + 's');
      throw err;
    }finally{
      clearTimeout(timer);
    }
  }

  const WMO = {

    rain: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"><path d="M6 11h11a3.5 3.5 0 0 0 0-7 4.8 4.8 0 0 0-9.1 1.3A3 3 0 0 0 6 11z" fill="var(--text-mid)" stroke="none"/><path d="M8 15l-1.5 3M13 15l-1.5 3M18 15l-1.5 3"/></svg>',
    snow: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#e4e4e7" stroke-width="1.5" stroke-linecap="round"><path d="M6 11h11a3.5 3.5 0 0 0 0-7 4.8 4.8 0 0 0-9.1 1.3A3 3 0 0 0 6 11z" fill="var(--text-mid)" stroke="none"/><path d="M8 15v4M6 16.5l4 1M10 16.5l-4 1M16 15v4M14 16.5l4 1M18 16.5l-4 1"/></svg>',
    storm: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M6 11h11a3.5 3.5 0 0 0 0-7 4.8 4.8 0 0 0-9.1 1.3A3 3 0 0 0 6 11z" fill="var(--text-dim)"/><path d="M12 12l-3 5h3l-1 4 4-6h-3l1-3z" fill="#fbbf24"/></svg>'
  };
  const WMO_ICON = {
    0:'sun', 1:'sun', 2:'partly', 3:'cloud',
    45:'fog', 48:'fog',
    51:'rain', 53:'rain', 55:'rain',
    61:'rain', 63:'rain', 65:'rain',
    71:'snow', 73:'snow', 75:'snow',
    80:'rain', 81:'rain', 82:'storm',
    95:'storm', 96:'storm', 99:'storm'
  };

  // Small circular refresh icon in the tile header, replacing the old big
  // text "Refresh" buttons. Spins briefly on click for feedback.
  const REFRESH_ICON_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>`;

  function addRefreshIcon(mod, onRefresh){
    const tile = document.querySelector(`[data-module="${mod}"]`);
    const right = tile.querySelector('.tile-head-right');
    if(!right || right.querySelector('.icon-refresh-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'icon-refresh-btn';
    btn.title = 'Refresh';
    btn.setAttribute('aria-label', 'Refresh');
    btn.innerHTML = REFRESH_ICON_SVG;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      btn.classList.add('spinning');
      setTimeout(() => btn.classList.remove('spinning'), 500);
      onRefresh();
    });
    right.appendChild(btn);
  }

  let weatherDailyData = null;
  let weatherSelectedDay = 0;

  function renderWeatherDaySelectorHTML(){
    const days = weatherDailyData.daily.time;
    const today = new Date().toDateString();
    return `<div id="weatherDaySelector" style="display:flex; gap:6px; width:100%; margin-top:2px;">
      ${days.map((dateStr, i) => {
        const d = new Date(dateStr + 'T00:00:00');
        const label = d.toDateString() === today ? 'Today' : d.toLocaleDateString('en-US', { weekday:'short' });
        return `<button class="transit-mode-btn weather-day-btn ${i === weatherSelectedDay ? 'active' : ''}" data-day="${i}" style="flex:1; padding:4px 2px; font-size:9px;">${label}</button>`;
      }).join('')}
    </div>`;
  }

  function renderWeatherDay(bodyEl, dayIndex){
    const data = weatherDailyData;
    const daily = data.daily;
    const isToday = dayIndex === 0;
    const weatherCode = isToday ? data.current.weather_code : daily.weather_code[dayIndex];
    const desc = WMO[weatherCode] || 'Unknown conditions';
    const iconKey = WMO_ICON[weatherCode] || 'cloud';
    const iconSvg = SVG_ICONS[iconKey];
    const tmax = Math.round(daily.temperature_2m_max[dayIndex]);
    const tmin = Math.round(daily.temperature_2m_min[dayIndex]);
    const rainChance = daily.precipitation_probability_max ? daily.precipitation_probability_max[dayIndex] : null;
    const sunrise = daily.sunrise ? new Date(daily.sunrise[dayIndex]).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }) : null;
    const sunset = daily.sunset ? new Date(daily.sunset[dayIndex]).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }) : null;

    const topLine = isToday
      ? `<div class="weather-summary-group">
          <div style="display:flex; align-items:center; gap:10px;">
          <span style="display:inline-flex; width:28px; height:28px; flex-shrink:0;">${iconSvg}</span>
          <div style="display:flex; align-items:baseline; gap:7px;">
            <span style="font-family:'JetBrains Mono',monospace; font-size:26px; color:var(--text);">${Math.round(data.current.temperature_2m)}°</span>
            <span style="font-size:10px; color:var(--text-mid);">feels ${Math.round(data.current.apparent_temperature)}°</span>
          </div>
        </div>
        <div class="tile-hint" style="margin-top:1px; font-size:11px;">${desc} · wind ${Math.round(data.current.wind_speed_10m)} km/h</div>
        </div>`
      : `<div class="weather-summary-group">
          <div style="display:flex; align-items:center; gap:10px;">
          <span style="display:inline-flex; width:28px; height:28px; flex-shrink:0;">${iconSvg}</span>
          <div style="display:flex; align-items:baseline; gap:7px;">
            <span style="font-family:'JetBrains Mono',monospace; font-size:26px; color:var(--text);">${tmax}°</span>
            <span style="font-size:10px; color:var(--text-mid);">low ${tmin}°</span>
          </div>
        </div>
        <div class="tile-hint" style="margin-top:1px; font-size:11px;">${desc}</div>
        </div>`;

    bodyEl.innerHTML = `
      ${renderWeatherDaySelectorHTML()}
      ${topLine}
      <div class="weather-stats-grid">
        <div class="weather-stat"><span class="weather-stat-label">Day / Night</span><span class="weather-stat-value">${tmax}° / ${tmin}°</span></div>
        <div class="weather-stat"><span class="weather-stat-label">Rain chance</span><span class="weather-stat-value" style="color:${rainChance != null && rainChance >= 50 ? 'var(--rose-bright)' : 'var(--text)'};">${rainChance != null ? rainChance + '%' : '—'}</span></div>
        <div class="weather-stat"><span class="weather-stat-label">☀ Sunrise</span><span class="weather-stat-value">${sunrise || '—'}</span></div>
        <div class="weather-stat"><span class="weather-stat-label">☾ Sunset</span><span class="weather-stat-value">${sunset || '—'}</span></div>
      </div>
    `;

    bodyEl.querySelectorAll('.weather-day-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        weatherSelectedDay = parseInt(btn.dataset.day, 10);
        renderWeatherDay(bodyEl, weatherSelectedDay);
      });
    });
  }

  async function connectWeather(){
    const tile = document.querySelector('[data-module="weather"]').closest('.tile');
    const stateEl = tile.querySelector('.tile-state');
    const bodyEl = tile.querySelector('.tile-body');
    const btn = tile.querySelector('button[data-module="weather"]');
    stateEl.textContent = 'Connecting…';
    stateEl.classList.remove('off');
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=6`;
      const res = await fetchWithTimeout(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      weatherDailyData = data;
      weatherSelectedDay = 0;

      stateEl.textContent = 'Live — ' + LOCATION.name;
      flashTile('weather');
      renderWeatherDay(bodyEl, 0);
      btn.style.display = 'none';
      addRefreshIcon('weather', connectWeather);

      connected.add('weather');
      refreshCount();
    }catch(err){
      stateEl.textContent = 'Connection error';
      bodyEl.querySelector('.tile-hint') && (bodyEl.querySelector('.tile-hint').textContent = 'Will retry on next load.');
      console.error('weather fetch failed', err);
    }
  }

  // ---- city search (Open-Meteo geocoding, no key needed) ----
  async function geocodeCitySuggestions(query){
    try{
      const res = await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`, null, 6000);
      if(!res.ok) return [];
      const data = await res.json();
      if(!data.results) return [];
      return data.results.map(r => ({
        name: r.name,
        region: [r.admin1, r.country].filter(Boolean).join(', '),
        lat: r.latitude,
        lon: r.longitude
      }));
    }catch(err){
      console.warn('suggestion fetch failed', err);
      return [];
    }
  }

  async function geocodeCity(query){
    let lastErr = null;
    // Primary: Open-Meteo geocoding (no key, CORS-enabled)
    try{
      const res = await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
      if(res.ok){
        const data = await res.json();
        if(data.results && data.results.length){
          const r = data.results[0];
          return { name: r.name + (r.country_code ? ', ' + r.country_code : ''), lat: r.latitude, lon: r.longitude };
        }
      } else {
        lastErr = new Error('Open-Meteo returned HTTP ' + res.status);
      }
    }catch(err){ lastErr = err; console.warn('Open-Meteo geocoding failed, trying fallback:', err); }

    // Fallback: Nominatim / OpenStreetMap (no key, widely CORS-friendly)
    try{
      const res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
      if(res.ok){
        const data = await res.json();
        if(data && data.length){
          const r = data[0];
          return { name: r.display_name.split(',')[0], lat: parseFloat(r.lat), lon: parseFloat(r.lon) };
        }
      } else {
        lastErr = new Error('Nominatim returned HTTP ' + res.status);
      }
    }catch(err){ lastErr = err; console.warn('Nominatim geocoding failed too:', err); }

    return { error: lastErr };
  }

  let cityMsgTimer = null;
  async function searchCity(query){
    const msg = document.getElementById('citySearchMsg');
    const btn = document.getElementById('citySearchBtn');
    if(!query) return;
    clearTimeout(cityMsgTimer);
    msg.style.display = 'block';
    msg.style.color = 'var(--text-dim)';
    msg.textContent = 'Searching for "' + query + '"…';
    btn.textContent = '…';
    btn.disabled = true;

    const result = await geocodeCity(query);

    btn.textContent = 'Search';
    btn.disabled = false;

    if(!result || !result.lat){
      msg.style.color = 'var(--rose-bright)';
      if(result && result.error){
        msg.textContent = 'City search failed: ' + (result.error.message || String(result.error)) + '.';
      } else {
        msg.textContent = 'City not found — check spelling.';
      }
      console.error('geocoding produced no usable result for', query, result);
      clearTimeout(cityMsgTimer);
      cityMsgTimer = setTimeout(() => { msg.style.display = 'none'; }, 4000);
      return;
    }

    msg.style.color = 'var(--text-dim)';
    msg.textContent = 'Found ' + result.name + ' (' + result.lat.toFixed(2) + ', ' + result.lon.toFixed(2) + ') — updating weather…';
    console.log('geocoded', query, '→', result);

    LOCATION.name = result.name;
    LOCATION.lat = result.lat;
    LOCATION.lon = result.lon;
    document.getElementById('citySearchInput').value = '';
    await connectWeather();
    msg.style.display = 'none';
    recenterRadar(result.lat, result.lon);
    if(document.getElementById('radarModalBackdrop').classList.contains('show')) loadPrecipOutlook();
  }

  // ---- rain radar (Leaflet + RainViewer tiles, no key needed) ----
  // Real MeteoSwiss radar files are raw HDF5 and need a backend to decode;
  // RainViewer gives live global radar imagery (incl. Switzerland) as simple
  // map tiles that work directly in the browser. Zoom caps below (maxNativeZoom:7,
  // maxZoom:12) match RainViewer's own reference implementation — radar tiles
  // aren't rendered past native zoom 7, so Leaflet upscales instead of requesting
  // unsupported levels (that's what caused the earlier "zoom level not supported").
  let radarMapInstance = null, radarLayer = null, radarMarker = null;
  let radarFrames = [], radarFrameIdx = 0, radarTimer = null, rainviewerHost = '';
  let radarMode = 'past';

  let leafletLoadPromise = null;
  function ensureLeaflet(){
    if(window.L) return Promise.resolve();
    if(leafletLoadPromise) return leafletLoadPromise;
    leafletLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Leaflet script failed to load'));
      document.head.appendChild(s);
    });
    return leafletLoadPromise;
  }

  async function openRadarModal(){
    const backdrop = document.getElementById('radarModalBackdrop');
    const box = document.getElementById('radarModalMap');
    backdrop.classList.add('show');
    loadPrecipOutlook();
    try{
      await ensureLeaflet();
      if(!radarMapInstance){
        box.innerHTML = '';
        radarMapInstance = L.map('radarModalMap', { attributionControl:true, maxZoom:12, minZoom:3 })
          .setView([LOCATION.lat, LOCATION.lon], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: 'abcd',
          maxZoom: 12
        }).addTo(radarMapInstance);
        radarMarker = L.marker([LOCATION.lat, LOCATION.lon]).addTo(radarMapInstance);

        document.getElementById('radarPlayBtn').addEventListener('click', toggleRadarPlay);
        document.getElementById('radarSlider').addEventListener('input', (e) => {
          stopRadarPlay();
          showRadarFrame(parseInt(e.target.value, 10));
        });
        document.querySelectorAll('#radarModeToggle .transit-mode-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            stopRadarPlay();
            radarMode = btn.dataset.radarMode;
            document.querySelectorAll('#radarModeToggle .transit-mode-btn').forEach(b => b.classList.toggle('active', b === btn));
            document.getElementById('radarModalTitle').textContent = radarMode === 'past' ? 'RAIN RADAR — PAST 2H' : 'RAIN RADAR — NEXT 6H';
            loadRadarFrames();
          });
        });

        await loadRadarFrames();
      } else {
        recenterRadar(LOCATION.lat, LOCATION.lon);
      }
      requestAnimationFrame(() => radarMapInstance.invalidateSize());
      setTimeout(() => radarMapInstance && radarMapInstance.invalidateSize(), 150);
      setTimeout(() => radarMapInstance && radarMapInstance.invalidateSize(), 400);
    }catch(err){
      console.error('radar modal init failed', err);
      box.innerHTML = '<div class="radar-placeholder" style="color:var(--rose-bright);">Radar failed to load — check your connection.</div>';
    }
  }

  function closeRadarModal(){
    document.getElementById('radarModalBackdrop').classList.remove('show');
    stopRadarPlay();
  }

  async function loadRadarFrames(){
    if(radarMode === 'future'){
      // OpenWeatherMap's forecast radar requires timestamps in exact 10-minute
      // steps, and only supports up to ~6h ahead - confirmed in their docs.
      const now = Math.floor(Date.now() / 1000);
      const rounded = now - (now % 600);
      radarFrames = [];
      for(let i = 1; i <= 12; i++){
        radarFrames.push({ time: rounded + i * 1800, source: 'openweather' }); // 12 x 30min = 6h
      }
      radarFrameIdx = 0;
      const slider = document.getElementById('radarSlider');
      slider.max = radarFrames.length - 1;
      slider.value = 0;
      showRadarFrame(0);
      return;
    }
    try{
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await res.json();
      rainviewerHost = data.host;
      // RainViewer's free public API only returns past frames (confirmed in their own
      // detailed technical docs, despite a marketing FAQ mentioning "nowcast") -
      // data.radar.nowcast is reliably empty. Future mode uses OpenWeatherMap instead.
      radarFrames = (data.radar.past || []).slice(-12).map(f => ({ ...f, source: 'rainviewer' }));
      radarFrameIdx = radarFrames.length - 1;
      const slider = document.getElementById('radarSlider');
      slider.max = radarFrames.length - 1;
      slider.value = radarFrameIdx;
      showRadarFrame(radarFrameIdx);
    }catch(err){
      console.error('rainviewer fetch failed', err);
      const label = document.getElementById('radarFrameLabel');
      if(label) label.textContent = 'Unavailable';
    }
  }

  function showRadarFrame(idx){
    if(!radarFrames[idx] || !radarMapInstance) return;
    radarFrameIdx = idx;
    const frame = radarFrames[idx];
    const url = frame.source === 'openweather'
      ? `/api/radar-forecast?z={z}&x={x}&y={y}&tm=${frame.time}`
      : `${rainviewerHost}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
    if(radarLayer) radarMapInstance.removeLayer(radarLayer);
    radarLayer = L.tileLayer(url, { opacity:0.7, zIndex:5, maxNativeZoom:7, maxZoom:12 }).addTo(radarMapInstance);
    const slider = document.getElementById('radarSlider');
    if(slider) slider.value = idx;
    const label = document.getElementById('radarFrameLabel');
    if(label){
      const d = new Date(frame.time * 1000);
      const prefix = frame.source === 'openweather' ? '+' : '';
      label.textContent = prefix + d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
    }
  }

  function toggleRadarPlay(){
    const btn = document.getElementById('radarPlayBtn');
    if(radarTimer){ stopRadarPlay(); return; }
    btn.textContent = 'Pause';
    radarTimer = setInterval(() => {
      const next = (radarFrameIdx + 1) % radarFrames.length;
      showRadarFrame(next);
    }, 500);
  }

  function stopRadarPlay(){
    clearInterval(radarTimer);
    radarTimer = null;
    const btn = document.getElementById('radarPlayBtn');
    if(btn) btn.textContent = 'Play';
  }

  function recenterRadar(lat, lon){
    if(!radarMapInstance) return;
    radarMapInstance.setView([lat, lon], 7);
    if(radarMarker) radarMapInstance.removeLayer(radarMarker);
    radarMarker = L.marker([lat, lon]).addTo(radarMapInstance);
  }

  // Radar imagery itself only extrapolates ~30-60min into the future (nowcast).
  // For a genuine 24h outlook we use Open-Meteo's forecast model instead.
  async function loadPrecipOutlook(){
    const el = document.getElementById('precipOutlook');
    const summaryEl = document.getElementById('precipSummary');
    el.innerHTML = '';
    if(summaryEl) summaryEl.textContent = 'Loading…';
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&hourly=precipitation_probability,precipitation&forecast_hours=24&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const times = data.hourly.time;
      const probs = data.hourly.precipitation_probability;
      const amounts = data.hourly.precipitation;

      // Plain-language summary: find the first stretch where rain is likely
      if(summaryEl){
        let firstIdx = -1, lastIdx = -1;
        for(let i = 0; i < probs.length; i++){
          if(probs[i] >= 50){
            if(firstIdx === -1) firstIdx = i;
            lastIdx = i;
          }
        }
        if(firstIdx === -1){
          summaryEl.textContent = 'No significant rain expected in the next 24h.';
        } else {
          const fmt = (i) => new Date(times[i]).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
          summaryEl.textContent = 'Rain likely between ' + fmt(firstIdx) + ' and ' + fmt(lastIdx) + '.';
        }
      }

      el.innerHTML = times.map((t, i) => {
        const pct = probs[i] || 0;
        const mm = amounts[i] || 0;
        const hour = new Date(t).getHours();
        const showLabel = i % 4 === 0;
        return `
          <div class="precip-bar-col">
            <div class="precip-bar" style="height:${Math.max(pct, 2)}%;" title="${pct}% · ${mm}mm"></div>
            ${showLabel ? `<div class="precip-bar-hour">${hour}h</div>` : ''}
          </div>`;
      }).join('');
    }catch(err){
      console.error('precip outlook failed', err);
      if(summaryEl) summaryEl.textContent = '';
      el.innerHTML = '<div class="tile-hint" style="color:var(--text-dim);">Outlook unavailable.</div>';
    }
  }

  document.getElementById('radarModalClose').addEventListener('click', closeRadarModal);
  document.getElementById('radarModalBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'radarModalBackdrop') closeRadarModal();
  });

  // ---- augment the weather tile with city search + a "Radar" button ----
  function augmentWeatherTile(){
    const tile = document.querySelector('[data-module="weather"]').closest('.tile');
    tile.classList.add('tile-wide');

    const head = tile.querySelector('.tile-head');
    const searchRow = document.createElement('div');
    searchRow.style.cssText = 'display:flex; gap:8px; margin:2px 0 4px; position:relative;';
    searchRow.innerHTML = `
      <div style="flex:1; min-width:0; position:relative;">
        <input id="citySearchInput" type="text" placeholder="Search city…" autocomplete="off" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:3px; color:var(--text); padding:7px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px; outline:none; box-sizing:border-box;">
        <div id="citySuggestions" class="city-suggestions"></div>
      </div>
      <button id="citySearchBtn" class="tile-cta" style="margin-top:0;">Search</button>
    `;
    head.insertAdjacentElement('afterend', searchRow);

    const msg = document.createElement('div');
    msg.id = 'citySearchMsg';
    msg.className = 'tile-hint';
    msg.style.cssText = 'display:none; color:var(--rose-bright); margin-bottom:2px;';
    searchRow.insertAdjacentElement('afterend', msg);

    const radarBtn = document.createElement('button');
    radarBtn.className = 'icon-refresh-btn';
    radarBtn.id = 'radarToggleBtn';
    radarBtn.title = 'Rain radar';
    radarBtn.setAttribute('aria-label', 'Rain radar');
    radarBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/><path d="M12 3v2M12 19v2M21 12h-2M5 12H3"/></svg>`;
    tile.querySelector('.tile-head-right').appendChild(radarBtn);

    const cityInput = document.getElementById('citySearchInput');
    const suggestionsBox = document.getElementById('citySuggestions');
    let suggestDebounce = null;

    async function pickCity(s){
      suggestionsBox.classList.remove('show');
      cityInput.value = '';
      const msg = document.getElementById('citySearchMsg');
      msg.style.display = 'block';
      msg.style.color = 'var(--text-dim)';
      msg.textContent = 'Loading ' + s.name + '…';
      try{
        LOCATION.name = s.name + (s.region ? ', ' + s.region.split(',')[0] : '');
        LOCATION.lat = s.lat;
        LOCATION.lon = s.lon;
        await connectWeather();
        recenterRadar(s.lat, s.lon);
        if(document.getElementById('radarModalBackdrop').classList.contains('show')) loadPrecipOutlook();
        msg.style.display = 'none';
      }catch(err){
        msg.style.color = 'var(--rose-bright)';
        msg.textContent = 'Failed to load ' + s.name + ': ' + (err && err.message ? err.message : 'unknown error');
        console.error('pickCity failed', err);
      }
    }

    cityInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearTimeout(suggestDebounce);
      clearTimeout(cityMsgTimer);
      document.getElementById('citySearchMsg').style.display = 'none';
      if(q.length < 2){
        suggestionsBox.classList.remove('show');

    const w = 70, h = 24;
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = (max - min) || 1;
    const step = w / (prices.length - 1);
    const pts = prices.map((p,i) => `${(i*step).toFixed(1)},${(h - ((p-min)/range)*h).toFixed(1)}`).join(' ');

  const GROQ_API_KEY = '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';

  // Neutral format: { role: 'user'|'assistant', text }. Converted per-provider at call time.

  function withScrollLock(fn){

  async function callGroq(model){
    const res = await fetchWithTimeout('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
      body: JSON.stringify({
        model: model,
        messages: chatHistory.map(m => ({ role: m.role, content: m.text }))
      })
    }, 20000);
    const data = await res.json();
    if(!res.ok){
      const err = new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!reply) throw new Error('Empty response from Groq.');
    return reply;
  }

  async function callGemini(){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    const res = await fetchWithTimeout(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY },
      body: JSON.stringify({
        contents: chatHistory.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.text }] }))
      })
    }, 20000);
    const data = await res.json();
    if(!res.ok){
      const err = new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    const reply = data.candidates && data.candidates[0] && data.candidates[0].content
      && data.candidates[0].content.parts && data.candidates[0].content.parts.map(p => p.text || '').join('');
    if(!reply) throw new Error('Empty response from Gemini.');
    return reply;
  }

  function isRetryable(err){
    return err.status === 503 || err.status === 429 || /high demand|overloaded|quota|no longer available/i.test(err.message || '');
  }

  async function askAI(thinkingEl){
    const providers = [];
    if(GROQ_API_KEY){
      GROQ_MODELS.forEach(m => providers.push({ name: m + ' (Groq)', call: () => callGroq(m) }));
    }
    providers.push({ name: GEMINI_MODEL + ' (Gemini)', call: callGemini });

    let lastErr;
    for(let i = 0; i < providers.length; i++){
      try{
        return await providers[i].call();
      }catch(err){
        lastErr = err;
        console.error(providers[i].name + ' failed:', err);
        if(!isRetryable(err) && i === providers.length - 1) throw err;
        if(i < providers.length - 1 && thinkingEl){
          thinkingEl.textContent = providers[i].name + ' failed: ' + err.message + ' — trying ' + providers[i+1].name + '…';
        }
      }
    }
    throw lastErr;
  }

  async function sendChatMessage(){
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('chatSendBtn');

    addChatMessage('user', text);

    const thinking = addChatMessage('assistant', '…');

    try{
      const reply = await askAI(thinking);
      if(window.marked) thinking.innerHTML = marked.parse(reply); else thinking.textContent = reply;
      chatHistory.push({ role: 'assistant', text: reply });
    }catch(err){
      thinking.remove();
      addChatMessage('system', 'AI request failed: ' + err.message);
      console.error('chat failed', err);
      chatHistory.pop(); // drop the unanswered user turn so retry doesn't duplicate context
    }
    btn.disabled = false;
    // no auto-focus here — focusing an input can trigger the browser's
    // own scroll-into-view behavior, which is what was moving the page

  // Voice input, meant for hands-free use (e.g. while working with gear) -
  // transcribes speech and sends automatically once you stop talking,
  // rather than requiring you to look at the screen and click Send.
  function setupVoiceInput(){
    const micBtn = document.getElementById('chatMicBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
      micBtn.style.display = 'none';
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    let listening = false;

    recognition.addEventListener('result', (e) => {
      const transcript = e.results[0][0].transcript;
      document.getElementById('chatInput').value = transcript;
      sendChatMessage();
    });
    recognition.addEventListener('end', () => {
      listening = false;
      micBtn.classList.remove('listening');
    });
    recognition.addEventListener('error', (e) => {
      console.error('speech recognition error', e.error);
      listening = false;
      micBtn.classList.remove('listening');
      if(e.error === 'not-allowed'){
        addChatMessage('system', 'Microphone access was denied — allow it in your browser to use voice input.');
      }
    });

    micBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(listening){
        recognition.stop();
        return;
      }
      listening = true;
      micBtn.classList.add('listening');
      try{
        recognition.start();
      }catch(err){
        console.error('speech recognition start failed', err);
        listening = false;
        micBtn.classList.remove('listening');
      }
    });
  }

    const handle = document.getElementById('chatPanelResize');
    const MIN_W = 300, MAX_W = 720;

    const savedWidth = parseInt(localStorage.getItem('chat_panel_width'), 10);
    if(savedWidth && savedWidth >= MIN_W && savedWidth <= MAX_W){
      panel.style.width = savedWidth + 'px';
    }

    let dragging = false, startX = 0, startWidth = 0;

    handle.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX;
      startWidth = panel.getBoundingClientRect().width;
      panel.classList.add('resizing');
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if(!dragging) return;
      const delta = startX - e.clientX; // dragging left = wider (panel anchored right)
      let newWidth = startWidth + delta;
      newWidth = Math.max(MIN_W, Math.min(MAX_W, newWidth));
      panel.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if(!dragging) return;
      dragging = false;
      panel.classList.remove('resizing');
      document.body.style.userSelect = '';
      localStorage.setItem('chat_panel_width', Math.round(panel.getBoundingClientRect().width));
    });
  })();

  document.addEventListener('keydown', (e) => {

  // ---- Gmail + Calendar (no OAuth, no Google Cloud Console) ----
  // Calendar: private ICS feed URL. Email: IMAP + App Password.
  // Both credentials live server-side in Vercel env vars, fetched through
  // /api/calendar and /api/gmail — never touch the browser or the repo.

  let gmailAccount = '1';
  let gmailOffset = 0;
  const GMAIL_PAGE_SIZE = 10;
  let gmailHasMore = false;
  const gmailCache = {}; // { '1': { messages, hasMore }, '2': {...} } - avoids reconnecting via IMAP on every account switch

  function renderMailAccountToggle(){

  let mailObserver = null;

  function renderMailMessages(bodyEl, msgs, append){
    const rowsHtml = msgs.map(m => `
      <div class="mail-row" data-uid="${m.uid}" style="width:100%; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer;">
        <div style="font-size:13px; color:var(--text);">${m.subject}</div>
        <div style="font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;">${m.from}</div>
      </div>`).join('');
    if(append){
      const hint = document.getElementById('mailLoadingMore');
      if(hint) hint.insertAdjacentHTML('beforebegin', rowsHtml);
      else bodyEl.insertAdjacentHTML('beforeend', rowsHtml);
    } else {
      bodyEl.innerHTML = rowsHtml;
    }
    const existingHint = document.getElementById('mailLoadingMore');
    if(existingHint) existingHint.remove();
    if(mailObserver) mailObserver.disconnect();
    if(gmailHasMore){
      bodyEl.insertAdjacentHTML('beforeend', `<div id="mailLoadingMore" class="tile-hint" style="color:var(--text-dim); text-align:center; padding:8px 0; width:100%;">Loading more…</div>`);
      const hintEl = document.getElementById('mailLoadingMore');
      mailObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            gmailOffset += GMAIL_PAGE_SIZE;
            loadGmail({ append: true });
          }
        });
      }, { root: bodyEl, rootMargin: '150px' });
      mailObserver.observe(hintEl);
    }
  }

  function renderMailFromCache(){
    const cache = gmailCache[gmailAccount];
    const bodyEl = setTileLive('mail', 'Live — Gmail');
    gmailHasMore = cache.hasMore;
    if(!cache.messages.length) bodyEl.innerHTML = '<div class="tile-hint">Inbox is empty.</div>';
    else renderMailMessages(bodyEl, cache.messages, false);
    connected.add('mail'); refreshCount();
  }

  async function loadGmail(opts){
    opts = opts || {};
    renderMailAccountToggle();

    // Already loaded this account this session - just show it, no reconnect.
    // Only an explicit refresh (force) or load-more bypasses the cache.
    if(!opts.force && !opts.append && gmailCache[gmailAccount]){
      renderMailFromCache();
      return;
    }
    if(opts.force) gmailOffset = 0;

    const bodyEl = opts.append
      ? document.querySelector('[data-module="mail"] .tile-body')
      : setTileLive('mail', 'Connecting…');
    try{
      const res = await fetchWithTimeout(`/api/google-data?source=gmail&account=${gmailAccount}&limit=${GMAIL_PAGE_SIZE}&offset=${gmailOffset}`, null, 25000);
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Gmail fetch failed');
      setTileLive('mail', 'Live — Gmail');
      gmailHasMore = !!data.hasMore;
      const msgs = data.messages || [];

      if(opts.append){
        gmailCache[gmailAccount].messages = gmailCache[gmailAccount].messages.concat(msgs);
        gmailCache[gmailAccount].hasMore = gmailHasMore;
        renderMailMessages(bodyEl, msgs, true);
      } else {
        gmailCache[gmailAccount] = { messages: msgs, hasMore: gmailHasMore };
        if(!msgs.length) bodyEl.innerHTML = '<div class="tile-hint">Inbox is empty.</div>';
        else renderMailMessages(bodyEl, msgs, false);
      }
      connected.add('mail'); refreshCount();
    }catch(err){
      console.error('gmail load failed', err);
      setTileLive('mail', 'Connection error');
      bodyEl.innerHTML = `<div class="tile-hint" style="color:var(--rose-bright);">${err.message}</div>`;
    }
  }

  async function openMailModal(uid){
    document.getElementById('mailModalTitle').textContent = 'Loading…';
    document.getElementById('mailModalMeta').textContent = '';
    document.getElementById('mailModalBody').innerHTML = '';
    document.getElementById('mailModalBackdrop').classList.add('show');

      const res = await fetchWithTimeout(`/api/google-data?source=gmail&action=read&uid=${uid}&account=${gmailAccount}`, null, 25000);

  let calEvents = [];
  let calViewDate = new Date();

  function eventsOnDay(date){
    return calEvents.filter(ev => {
      const d = new Date(ev.start);
      return d.getFullYear() === date.getFullYear() && d.getMonth() === date.getMonth() && d.getDate() === date.getDate();
    });
  }

  function renderCalendarGrid(){
    const bodyEl = document.querySelector('[data-module="agenda"] .tile-body');
    const now = new Date();
    const upcoming = calEvents.filter(ev => new Date(ev.start) >= now).slice(0, 3);

    const next3Html = upcoming.length
      ? upcoming.map(ev => {
          const d = new Date(ev.start);
          const dateStr = ev.allDay
            ? d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })
            : d.toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
          return `<div class="cal-next3-item">
            <span style="font-size:13px; color:var(--text);">${ev.summary}</span>
            <span style="font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; white-space:nowrap; margin-left:10px;">${dateStr}</span>
          </div>`;
        }).join('')
      : '<div class="tile-hint">No upcoming events.</div>';

    const year = calViewDate.getFullYear(), month = calViewDate.getMonth();
    const monthLabel = calViewDate.toLocaleDateString('en-US', { month:'long', year:'numeric' });
    const firstOfMonth = new Date(year, month, 1);
    const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-first week
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dow = ['Mo','Tu','We','Th','Fr','Sa','Su'];

    let dayCells = '';
    for(let i = 0; i < startOffset; i++) dayCells += '<div class="cal-day empty"></div>';
    for(let day = 1; day <= daysInMonth; day++){
      const cellDate = new Date(year, month, day);
      const isToday = cellDate.toDateString() === now.toDateString();
      const dayEvents = eventsOnDay(cellDate);
      dayCells += `<div class="cal-day ${isToday ? 'today' : ''} ${dayEvents.length ? 'has-events' : ''}" data-date="${cellDate.toISOString()}">
        <span>${day}</span>
        ${dayEvents.length ? '<div class="cal-day-dot"></div>' : ''}
      </div>`;
    }

    bodyEl.innerHTML = `
      <div class="cal-next3">${next3Html}</div>
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrevBtn">‹</button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="cal-nav-btn" id="calNextBtn">›</button>
      </div>
      <div class="cal-grid">
        ${dow.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${dayCells}
      </div>
      <div id="calDayEvents"></div>
    `;

    document.getElementById('calPrevBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      calViewDate = new Date(year, month - 1, 1);
      renderCalendarGrid();
    });
    document.getElementById('calNextBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      calViewDate = new Date(year, month + 1, 1);
      renderCalendarGrid();
    });
    bodyEl.querySelectorAll('.cal-day.has-events').forEach(cell => {
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        const date = new Date(cell.dataset.date);
        const dayEvents = eventsOnDay(date);
        const label = date.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
        document.getElementById('calDayEvents').innerHTML = `
          <div class="cal-day-events">
            <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px;">${label}</div>
            ${dayEvents.map(ev => {
              const t = ev.allDay ? 'All day' : new Date(ev.start).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
              return `<div class="cal-next3-item"><span style="font-size:13px; color:var(--text);">${ev.summary}</span><span style="font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;">${t}</span></div>`;
            }).join('')}
          </div>`;
      });
    });
  }

  function flashTile(mod){

  function setTileLive(mod, label){

        <div class="skeleton-row" style="width:60%;"></div>

  // ---- News (RSS, no key needed at all) ----
  const NEWS_PAGE_SIZE = 8;
  let newsItems = [];
  let newsShownCount = 0;

  function renderNewsItem(it){
    return `
      <a href="${it.link || '#'}" target="_blank" rel="noopener" style="width:100%; display:block; padding:6px 0; border-bottom:1px solid var(--line); text-decoration:none;">
        <div style="font-size:13px; color:var(--text);">${it.title}</div>
        <div style="font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;">${it.source}</div>
      </a>`;
  }

  function renderMoreNews(){
    const bodyEl = document.querySelector('[data-module="news"] .tile-body');
    if(!bodyEl) return;
    const nextBatch = newsItems.slice(newsShownCount, newsShownCount + NEWS_PAGE_SIZE);
    if(!nextBatch.length) return;
    const loadingEl = bodyEl.querySelector('#newsLoadingMore');
    const html = nextBatch.map(renderNewsItem).join('');
    if(loadingEl) loadingEl.insertAdjacentHTML('beforebegin', html);
    else bodyEl.insertAdjacentHTML('beforeend', html);
    newsShownCount += nextBatch.length;
    if(loadingEl && newsShownCount >= newsItems.length){
      loadingEl.remove();
      if(newsObserver) newsObserver.disconnect();
    }
  }

  async function loadNews(){
    const bodyEl = setTileLive('news', 'Connecting…');
    try{
      const res = await fetchWithTimeout('/api/news');
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'News fetch failed');
      const label = data.failedSources && data.failedSources.length
        ? 'Live — some sources down (' + data.failedSources.join(', ') + ')'
        : 'Live — RSS';
      setTileLive('news', label);
      newsItems = data.items || [];
      newsShownCount = 0;
      if(!newsItems.length){
        bodyEl.innerHTML = '<div class="tile-hint">No headlines available.</div>';
      } else {
        bodyEl.innerHTML = newsItems.length > NEWS_PAGE_SIZE
          ? '<div id="newsLoadingMore" class="tile-hint" style="color:var(--text-dim); text-align:center; padding:8px 0;">Scroll for more…</div>'
          : '';
        renderMoreNews();
        setupNewsObserver();
      }
      connected.add('news'); refreshCount();
    }catch(err){
      console.error('news load failed', err);
      setTileLive('news', 'Connection error');
      bodyEl.innerHTML = `<div class="tile-hint" style="color:var(--rose-bright);">${err.message}</div>`;
    }
  }

  // Load the next batch when scrolled near the bottom of the News tile body.
  // Throttled to once per animation frame - this listener is document-level
  // (has to be, to catch scroll on any tile-body), so without throttling it
  // would re-run its check on every single scroll event from anywhere in the
  // app, including tiles that have nothing to do with News.
  // Watches the "Scroll for more..." hint's actual visibility rather than
  // depending on scroll deltas - a scroll listener can't fire at all if the
  // container ends up taller than its own content (no real overflow to
  // scroll into), which happens once the News/video split is dragged large.
  let newsObserver = null;
  function setupNewsObserver(){
    const bodyEl = document.querySelector('[data-module="news"] .tile-body');
    const hintEl = document.getElementById('newsLoadingMore');
    if(!bodyEl || !hintEl) return;
    if(newsObserver) newsObserver.disconnect();
    newsObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if(entry.isIntersecting) renderMoreNews(); });
    }, { root: bodyEl, rootMargin: '150px' });
    newsObserver.observe(hintEl);
  }

  const newsBtn = document.querySelector('button[data-module="news"]');
  if(newsBtn) newsBtn.style.display = 'none';
  addRefreshIcon('news', loadNews);
  setTimeout(loadNews, 1000);

  // ---- Live 24/7 news feed (YouTube embed via Data API lookup) ----
  // Channels are stored and resolved by NAME - the server looks up the real
  // channel ID and current live video via the YouTube Data API each time,
  // so nobody (including me) has to hunt down or guess raw channel IDs.
  // Sourced from an aggregator that specifically curates channels confirmed
  // to run real 24/7 YouTube live streams (not just occasional live clips),
  // rather than guessed - much better odds of actually being live.
  const DEFAULT_LIVE_CHANNELS = ['Sky News', 'Al Jazeera English', 'France 24 English', 'DW News', 'NBC News NOW', 'CBS News'];

  function augmentNewsTile(){
    const tile = document.querySelector('[data-module="news"]');
    const section = document.createElement('div');
    section.className = 'live-feed-section';

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'news-resize-handle';
    resizeHandle.id = 'newsResizeHandle';
    tile.querySelector('.tile-body').insertAdjacentElement('afterend', resizeHandle);

    section.innerHTML = `
      <div class="live-feed-row">
        <select id="liveFeedSelect" class="transit-input" style="flex:1; min-width:0;"></select>
        <button class="tile-cta" id="liveFeedAddBtn" style="margin-top:0;">+ Add</button>
      </div>
      <div id="liveFeedAddRow" class="live-feed-row" style="display:none;">
        <input id="liveFeedNameInput" type="text" class="transit-input" placeholder="Channel name (e.g. Bloomberg TV)" style="flex:1; min-width:0;">
        <button class="tile-cta" id="liveFeedSaveBtn" style="margin-top:0;">Add</button>
      </div>
      <div class="live-feed-frame-wrap">
        <iframe id="liveFeedIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
      <div id="liveFeedMsg" class="tile-hint" style="display:none; color:var(--rose-bright); margin-top:6px;"></div>
    `;
    tile.appendChild(section);

    function getChannels(){
      try{
        const saved = JSON.parse(localStorage.getItem('live_news_channel_names') || 'null');
        return saved && saved.length ? saved : DEFAULT_LIVE_CHANNELS;
      }catch(e){ return DEFAULT_LIVE_CHANNELS; }
    }
    function saveChannels(list){
      localStorage.setItem('live_news_channel_names', JSON.stringify(list));
    }

    function renderSelect(){
      const select = document.getElementById('liveFeedSelect');
      const channels = getChannels();
      const last = localStorage.getItem('live_news_selected_name');
      select.innerHTML = channels.map(name => `<option value="${name}">${name}</option>`).join('');
      const toSelect = channels.includes(last) ? last : channels[0];
      select.value = toSelect;
      loadFeed(toSelect, false);
    }

    async function loadFeed(channelName, autoplay){
      const iframe = document.getElementById('liveFeedIframe');
      const msg = document.getElementById('liveFeedMsg');
      msg.style.display = 'none';
      iframe.src = '';
      localStorage.setItem('live_news_selected_name', channelName);
      try{
        const res = await fetchWithTimeout(`/api/youtube-live?channelName=${encodeURIComponent(channelName)}`, null, 8000);
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Lookup failed');
        if(!data.videoId){
          msg.textContent = (data.message || 'No live broadcast found right now.') +
            ' This can mean the broadcaster doesn\u2019t run a 24/7 YouTube live stream, or the name matched a different channel than intended - try a more specific name.';
          msg.style.display = 'block';
          return;
        }
        // autoplay=1 only fires from a real click (select change / add channel),
        // which browsers allow unmuted since it follows a genuine user gesture.
        iframe.src = `https://www.youtube.com/embed/${data.videoId}?autoplay=${autoplay ? 1 : 0}`;
      }catch(err){
        console.error('live feed lookup failed', err);
        msg.textContent = 'Could not check this channel: ' + err.message;
        msg.style.display = 'block';
      }
    }

    document.getElementById('liveFeedSelect').addEventListener('change', (e) => loadFeed(e.target.value, true));

    document.getElementById('liveFeedAddBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('liveFeedAddRow').style.display =
        document.getElementById('liveFeedAddRow').style.display === 'none' ? 'flex' : 'none';
    });

    document.getElementById('liveFeedSaveBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const name = document.getElementById('liveFeedNameInput').value.trim();
      if(!name) return;
      const channels = getChannels();
      if(!channels.includes(name)) channels.push(name);
      saveChannels(channels);
      document.getElementById('liveFeedNameInput').value = '';
      document.getElementById('liveFeedAddRow').style.display = 'none';
      renderSelect();
      document.getElementById('liveFeedSelect').value = name;
      loadFeed(name, true);
    });

    // ---- drag to resize headline list vs. live feed player ----
    (function setupNewsResize(){
      const bodyEl = tile.querySelector('.tile-body');
      const MIN_H = 50, MAX_H = 2000;
      const saved = parseInt(localStorage.getItem('news_body_height'), 10);
      if(saved && saved >= MIN_H && saved <= MAX_H) bodyEl.style.flexBasis = saved + 'px';

      let dragging = false, startY = 0, startHeight = 0;
      resizeHandle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragging = true;
        startY = e.clientY;
        startHeight = bodyEl.getBoundingClientRect().height;
        document.body.style.userSelect = 'none';
      });
      document.addEventListener('mousemove', (e) => {
        if(!dragging) return;
        let newHeight = startHeight + (e.clientY - startY);
        newHeight = Math.max(MIN_H, Math.min(MAX_H, newHeight));
        bodyEl.style.flexBasis = newHeight + 'px';
      });
      document.addEventListener('mouseup', () => {
        if(!dragging) return;
        dragging = false;
        document.body.style.userSelect = '';
        localStorage.setItem('news_body_height', Math.round(bodyEl.getBoundingClientRect().height));
      });
    })();

    setTimeout(renderSelect, 1500);
