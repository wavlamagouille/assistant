<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAV / ASSISTANT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg: #18181b;
    --bg-raised: #1f1f23;
    --line: #2c2c31;
    --rose: #9f1239;
    --rose-bright: #e11d48;
    --text: #f4f4f5;
    --text-dim: #71717a;
    --text-mid: #a1a1aa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--rose); color:#fff; }

  /* ---------- BOOT ---------- */
  #boot{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    z-index:100;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #boot.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .bars{
    display:flex; align-items:flex-end; gap:5px; height:64px;
  }
  .bars span{
    width:5px;
    background:var(--rose-bright);
    border-radius:1px;
    animation:meter 1.1s ease-in-out infinite;
    opacity:.9;
  }
  .bars span:nth-child(1){ animation-delay:0s; }
  .bars span:nth-child(2){ animation-delay:.08s; }
  .bars span:nth-child(3){ animation-delay:.16s; }
  .bars span:nth-child(4){ animation-delay:.24s; }
  .bars span:nth-child(5){ animation-delay:.32s; }
  .bars span:nth-child(6){ animation-delay:.4s; }
  .bars span:nth-child(7){ animation-delay:.48s; }
  .bars span:nth-child(8){ animation-delay:.56s; }
  .bars span:nth-child(9){ animation-delay:.64s; }
  .bars span:nth-child(10){ animation-delay:.72s; }
  .bars span:nth-child(11){ animation-delay:.8s; }
  .bars span:nth-child(12){ animation-delay:.88s; }
  @keyframes meter{
    0%,100%{ height:6px; }
    50%{ height:var(--h, 58px); }
  }
  #boot-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.25em;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  /* ---------- SHELL ---------- */
  #shell{
    height:100%;
    display:flex; flex-direction:column;
    opacity:0;
    transition:opacity .7s ease;
  }
  #shell.show{ opacity:1; }

  header{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    overflow:hidden;
  }
  header .amb{
    position:absolute; inset:0;
    display:flex; align-items:flex-end; gap:3px;
    padding:0 32px;
    opacity:.08;
    pointer-events:none;
  }
  header .amb span{
    flex:1;
    background:var(--rose-bright);
    animation:meter 2.4s ease-in-out infinite;
  }
  .brand{ position:relative; display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px;
    letter-spacing:.06em;
    line-height:1;
  }
  .brand .mark span{ color:var(--rose-bright); }
  .brand .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:.15em;
    text-transform:uppercase;
  }
  .status{ position:relative; display:flex; align-items:center; gap:22px; }
  .clock{
    font-family:'JetBrains Mono', monospace;
    text-align:right;
    line-height:1.3;
  }
  .clock .time{ font-size:15px; color:var(--text); }
  .clock .date{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; }
  .live{ display:flex; align-items:center; gap:7px; }
  .live .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--rose-bright);
    box-shadow:0 0 0 0 rgba(225,29,72,.6);
    animation:pulse 2s infinite;
  }
  .live .txt{
    font-family:'JetBrains Mono', monospace;
    font-size:9px; letter-spacing:.2em;
    color:var(--text-dim); text-transform:uppercase;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(225,29,72,.5); }
    70%{ box-shadow:0 0 0 8px rgba(225,29,72,0); }
    100%{ box-shadow:0 0 0 0 rgba(225,29,72,0); }
  }

  main{
    flex:1;
    padding:28px 32px 32px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:16px;
    overflow-y:auto;
    overflow-anchor:none;
  }
  .chat-tile{ grid-column: 1 / -1; }
  .tile-wide{ grid-column: 1 / -1; }

  .leaflet-container{ background:#0f0f11; font-family:'JetBrains Mono', monospace; }
  .leaflet-control-attribution{ background:rgba(24,24,27,.85)!important; color:var(--text-dim)!important; font-size:9px!important; }
  .leaflet-control-attribution a{ color:var(--text-mid)!important; }
  .leaflet-bar a{ background:var(--bg-raised)!important; color:var(--text)!important; border-color:var(--line)!important; }
  .leaflet-bar a:hover{ background:var(--rose)!important; }

  .radar-modal-map{
    height:60vh;
    min-height:360px;
    width:100%;
    background:#0f0f11;
  }
  .radar-controls{
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
    border-top:1px solid var(--line);
  }
  .radar-controls input[type="range"]{
    flex:1;
    accent-color:var(--rose-bright);
  }
  .radar-controls .tile-idx{ min-width:56px; text-align:right; }

  .precip-outlook-wrap{ padding:12px 20px 18px; border-top:1px solid var(--line); }
  .precip-outlook-label{
    font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:.12em;
    color:var(--text-dim); text-transform:uppercase; margin-bottom:8px;
  }
  .precip-summary{
    font-size:14px; color:var(--text); margin-bottom:10px;
  }

  .city-suggestions{
    display:none;
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:2px;
    max-height:220px;
    overflow-y:auto;
    z-index:20;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .city-suggestions.show{ display:block; }
  .city-suggestion{
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:10px;
  }
  .city-suggestion:last-child{ border-bottom:none; }
  .city-suggestion:hover{ background:var(--bg); }
  .city-suggestion .cs-name{ color:var(--text); }
  .city-suggestion .cs-region{ color:var(--text-dim); font-family:'JetBrains Mono', monospace; font-size:11px; white-space:nowrap; }
  .precip-outlook{ display:flex; align-items:flex-end; gap:3px; height:56px; }
  .precip-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px; }
  .precip-bar{ width:100%; max-width:14px; background:var(--rose-bright); opacity:.75; border-radius:1px 1px 0 0; min-height:2px; }
  .precip-bar-hour{ font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-dim); }
  .radar-placeholder{
    display:flex; align-items:center; justify-content:center;
    height:100%; width:100%;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--text-dim);
  }

  .tile{
    position:relative;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:3px;
    padding:20px 22px;
    display:flex; flex-direction:column;
    gap:14px;
    min-height:150px;
    transition:border-color .2s ease;
  }
  .tile:hover{ border-color:#3f3f46; }
  .tile::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0;
    width:3px;
    border-radius:3px 0 0 3px;
    background:var(--line);
    transition:background .2s ease;
  }
  .tile:hover::before{ background:var(--rose-bright); }

  .tile-head{ display:flex; align-items:center; justify-content:space-between; }
  .tile-name{
    font-family:'Bebas Neue', sans-serif;
    font-size:19px;
    letter-spacing:.04em;
    color:var(--text);
  }
  .tile-idx{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
  }
  .tile-body{
    display:flex; flex-direction:column;
    align-items:flex-start; justify-content:flex-start;
    gap:6px;
    max-height:320px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .tile-body::-webkit-scrollbar{ width:6px; }
  .tile-body::-webkit-scrollbar-track{ background:transparent; }
  .tile-body::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .tile-body::-webkit-scrollbar-thumb:hover{ background:#3f3f46; }
  .tile-state{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .tile-state.off::before{ content:'○  '; color:var(--text-dim); }
  .tile-hint{
    font-size:13px;
    color:var(--text-mid);
    line-height:1.5;
  }
  .tile-cta{
    align-self:flex-start;
    margin-top:2px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--rose-bright);
    background:none; border:1px solid var(--rose);
    padding:7px 12px;
    border-radius:2px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tile-cta:hover{ background:var(--rose-bright); color:#18181b; border-color:var(--rose-bright); }

  .chat-tile{
    display:flex; flex-direction:row; align-items:center; justify-content:space-between;
    min-height:auto;
    padding:16px 22px;
  }
  .chat-tile.active{ flex-direction:column; align-items:stretch; gap:10px; }
  .chat-tile .tile-name{ font-size:19px; }
  .chat-left{ display:flex; align-items:center; gap:16px; }
  .chat-tile .tile-hint{ font-size:12px; }

  .chat-messages{
    display:flex; flex-direction:column; gap:10px;
    max-height:320px; overflow-y:auto;
    padding:4px 2px;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
    flex-grow:0; flex-shrink:0; justify-content:flex-start;
  }
  .chat-messages::-webkit-scrollbar{ width:6px; }
  .chat-messages::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .chat-msg{ max-width:75%; padding:9px 13px; border-radius:3px; font-size:13px; line-height:1.5; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; background:var(--rose); color:#fff; }
  .chat-msg.assistant{ align-self:flex-start; background:var(--bg); border:1px solid var(--line); color:var(--text); }
  .chat-msg.system{ align-self:center; color:var(--rose-bright); font-family:'JetBrains Mono',monospace; font-size:11px; text-align:center; }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:2px;
    color:var(--text); padding:9px 12px; font-family:'Space Grotesk',sans-serif; font-size:13px; outline:none;
  }

  footer{
    flex-shrink:0;
    padding:10px 32px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:.15em;
    color:var(--text-dim);
    text-transform:uppercase;
    display:flex; justify-content:space-between;
  }

  @media (max-width: 640px){
    header{ padding:16px 20px; }
    main{ padding:20px; grid-template-columns:1fr; }
    footer{ padding:10px 20px; }
  }

  .coin-row{ cursor:pointer; padding:4px 0; border-radius:2px; transition:opacity .15s ease; }
  .coin-row:hover{ opacity:.75; }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,.7);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    opacity:0; visibility:hidden;
    transition:opacity .2s ease, visibility .2s ease;
  }
  .modal-backdrop.show{ opacity:1; visibility:visible; }
  .modal-panel{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:4px;
    width:min(920px, 92vw);
    max-height:88vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
  }
  .modal-title{
    font-family:'Bebas Neue', sans-serif;
    font-size:20px;
    letter-spacing:.04em;
  }
  .modal-close{
    background:none; border:1px solid var(--line);
    color:var(--text-mid);
    width:28px; height:28px;
    border-radius:2px;
    cursor:pointer;
    font-size:14px;
    transition:border-color .15s ease, color .15s ease;
  }
  .modal-close:hover{ border-color:var(--rose-bright); color:var(--rose-bright); }
  #tv-chart-container{ height:520px; width:100%; }
  @media (max-width: 640px){
    .modal-panel{ width:96vw; }
    #tv-chart-container{ height:70vh; }
  }
</style>
</head>
<body>

  <div id="boot">
    <div class="bars" id="bootBars"></div>
    <div id="boot-label">BOOTING</div>
  </div>

  <div id="shell">
    <header>
      <div class="amb" id="ambBars"></div>
      <div class="brand">
        <div class="mark">WAV<span>/</span>ASSISTANT</div>
        <div class="sub">Personal console</div>
      </div>
      <div class="status">
        <div class="live"><div class="dot"></div><div class="txt">Online</div></div>
        <div class="clock">
          <div class="time" id="time">--:--:--</div>
          <div class="date" id="date">-- --- ----</div>
        </div>
      </div>
    </header>

    <main id="grid">
      <!-- tiles injected by JS -->
    </main>

    <footer>
      <span>WAVAUDIOLAB / ASSISTANT — v0.1</span>
      <span id="modcount">0 / 7 MODULES CONNECTED</span>
    </footer>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-panel">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">BTC / USDT</div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div id="tv-chart-container"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="radarModalBackdrop">
    <div class="modal-panel">
      <div class="modal-head">
        <div class="modal-title">RAIN RADAR — LAST 2H</div>
        <button class="modal-close" id="radarModalClose">✕</button>
      </div>
      <div id="radarModalMap" class="radar-modal-map"></div>
      <div class="radar-controls">
        <button class="tile-cta" id="radarPlayBtn" style="margin-top:0;">Play</button>
        <input type="range" id="radarSlider" min="0" max="0" value="0">
        <span class="tile-idx" id="radarFrameLabel">—</span>
      </div>
      <div class="precip-outlook-wrap">
        <div class="precip-outlook-label">24H FORECAST OUTLOOK — for future rain, use this, not the radar above</div>
        <div id="precipSummary" class="precip-summary"></div>
        <div id="precipOutlook" class="precip-outlook"></div>
      </div>
    </div>
  </div>

<script>
  // ---- boot bars ----
  const bootBars = document.getElementById('bootBars');
  for(let i=0;i<12;i++){
    const s = document.createElement('span');
    s.style.setProperty('--h', (24 + Math.random()*46).toFixed(0)+'px');
    bootBars.appendChild(s);
  }
  const ambBars = document.getElementById('ambBars');
  for(let i=0;i<48;i++){
    const s = document.createElement('span');
    s.style.setProperty('--h', (10 + Math.random()*40).toFixed(0)+'px');
    s.style.animationDelay = (Math.random()*2.4).toFixed(2)+'s';
    ambBars.appendChild(s);
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('boot').classList.add('hide');
      document.getElementById('shell').classList.add('show');
    }, 900);
  });

  // ---- clock ----
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function tick(){
    const n = new Date();
    document.getElementById('time').textContent =
      String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
    document.getElementById('date').textContent =
      days[n.getDay()]+' '+String(n.getDate()).padStart(2,'0')+' '+months[n.getMonth()]+' '+n.getFullYear();
  }
  tick(); setInterval(tick, 1000);

  // ---- modules ----
  const modules = [
    { id:'weather',  name:'WEATHER',    idx:'01', hint:"Today's local forecast." },
    { id:'mail',     name:'EMAIL',      idx:'02', hint:'Daily summary of your Gmail inbox.' },
    { id:'agenda',   name:'CALENDAR',   idx:'03', hint:'Upcoming Google Calendar events.' },
    { id:'markets',  name:'MARKETS',    idx:'04', hint:'Tracked crypto & asset prices, with charts.' },
    { id:'news',     name:'NEWS',       idx:'05', hint:"Today's headlines, sources TBD." },
    { id:'mastering',name:'MASTERING',  idx:'06', hint:'Status of Wavaudiolab client submissions.' },
  ];

  const grid = document.getElementById('grid');
  modules.forEach(m => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `
      <div class="tile-head">
        <div class="tile-name">${m.name}</div>
        <div class="tile-idx">${m.idx}</div>
      </div>
      <div class="tile-state off">Not connected</div>
      <div class="tile-body">
        <div class="tile-hint">${m.hint}</div>
      </div>
      <button class="tile-cta" data-module="${m.id}">Connect</button>
    `;
    grid.appendChild(tile);
  });

  const chat = document.createElement('div');
  chat.className = 'tile chat-tile';
  chat.innerHTML = `
    <div class="chat-left">
      <div class="tile-name">AI CHAT</div>
      <div class="tile-hint" id="chatHint">Ask about your day — powered by Gemini.</div>
    </div>
    <button class="tile-cta" id="chatActivateBtn" data-module="chat">Activate</button>
  `;
  grid.appendChild(chat);


  const connected = new Set();
  function refreshCount(){
    document.getElementById('modcount').textContent = connected.size + ' / 7 MODULES CONNECTED';
  }
  refreshCount();

  // These modules aren't fake-"coming soon" — they genuinely need something
  // from Flo before they can go live (credentials, a project config, an API key).
  // Clicking Connect tells you exactly what's missing instead of pretending.
  const NEEDS = {
    mail:      'Needs a Google OAuth setup so the app can read Gmail on your behalf.',
    agenda:    'Needs the same Google OAuth setup as Email — can share credentials.',
    news:      'Needs an RSS source list or a news API key to pull headlines.',
    mastering: "Needs your Wavaudiolab Firebase project config to read submissions."
  };

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.tile-cta');
    if(!btn) return;
    const mod = btn.dataset.module;
    if(mod === 'weather' || mod === 'markets' || mod === 'chat') return; // already live

    const tile = btn.closest('.tile');
    const stateEl = tile.querySelector('.tile-state');
    if(stateEl){
      stateEl.textContent = 'Setup required';
      stateEl.classList.remove('off');
      stateEl.style.color = 'var(--rose-bright)';
    }
    let noteEl = tile.querySelector('.tile-need');
    if(!noteEl){
      noteEl = document.createElement('div');
      noteEl.className = 'tile-hint tile-need';
      noteEl.style.color = 'var(--text-dim)';
      (tile.querySelector('.tile-body') || tile.querySelector('.chat-left')).appendChild(noteEl);
    }
    noteEl.textContent = NEEDS[mod] || 'Needs setup.';
  });

  // ---- weather module (Open-Meteo, no key needed) ----
  // Default location: Rolle, VD. Change LOCATION to move it.
  const LOCATION = { name: 'Rolle, VD', lat: 46.4667, lon: 6.3333 };

  // Every fetch in this app should use this — a hung request (bad wifi, a
  // stalled connection) will now fail loudly after 10s instead of leaving
  // a "Loading…" state stuck forever with no way to recover.
  async function fetchWithTimeout(url, options, ms = 10000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try{
      return await fetch(url, { ...(options || {}), signal: controller.signal });
    }catch(err){
      if(err.name === 'AbortError') throw new Error('Request timed out after ' + (ms/1000) + 's');
      throw err;
    }finally{
      clearTimeout(timer);
    }
  }

  const WMO = {
    0:'Clear sky', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Fog', 48:'Rime fog',
    51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain',
    71:'Light snow', 73:'Snow', 75:'Heavy snow',
    80:'Light showers', 81:'Showers', 82:'Heavy showers',
    95:'Thunderstorm', 96:'Thunderstorm with hail', 99:'Severe thunderstorm'
  };
  const WMO_ICON = {
    0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
    45:'🌫️', 48:'🌫️',
    51:'🌦️', 53:'🌦️', 55:'🌧️',

  async function connectWeather(){
    const tile = document.querySelector('[data-module="weather"]').closest('.tile');
    const stateEl = tile.querySelector('.tile-state');
    const bodyEl = tile.querySelector('.tile-body');
    const btn = tile.querySelector('button[data-module="weather"]');
    stateEl.textContent = 'Connecting…';
    stateEl.classList.remove('off');
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
      const res = await fetchWithTimeout(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const cur = data.current;
      const desc = WMO[cur.weather_code] || 'Unknown conditions';
      const icon = WMO_ICON[cur.weather_code] || '🌡️';
      const tmax = Math.round(data.daily.temperature_2m_max[0]);
      const tmin = Math.round(data.daily.temperature_2m_min[0]);

      stateEl.textContent = 'Live — ' + LOCATION.name;
      bodyEl.innerHTML = `
        <div style="display:flex; align-items:center; gap:16px;">
          <span style="font-size:44px; line-height:1;">${icon}</span>
          <div style="display:flex; align-items:baseline; gap:10px;">
            <span style="font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--text);">${Math.round(cur.temperature_2m)}°</span>
            <span style="font-size:13px; color:var(--text-mid);">feels like ${Math.round(cur.apparent_temperature)}°</span>
          </div>
        </div>
        <div class="tile-hint">${desc} · wind ${Math.round(cur.wind_speed_10m)} km/h</div>
        <div class="tile-hint" style="color:var(--text-dim);">day ${tmax}° / night ${tmin}°</div>
      `;
      btn.textContent = 'Refresh';
      btn.disabled = false;
      btn.style.opacity = 1;
      btn.style.cursor = 'pointer';
      btn.onclick = (e) => { e.stopPropagation(); connectWeather(); };

      connected.add('weather');
      refreshCount();
    }catch(err){
      stateEl.textContent = 'Connection error';
      bodyEl.querySelector('.tile-hint') && (bodyEl.querySelector('.tile-hint').textContent = 'Will retry on next load.');
      console.error('weather fetch failed', err);
    }
  }

  // ---- city search (Open-Meteo geocoding, no key needed) ----
  async function geocodeCitySuggestions(query){
    try{
      const res = await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`, null, 6000);
      if(!res.ok) return [];
      const data = await res.json();
      if(!data.results) return [];
      return data.results.map(r => ({
        name: r.name,
        region: [r.admin1, r.country].filter(Boolean).join(', '),
        lat: r.latitude,
        lon: r.longitude
      }));
    }catch(err){
      console.warn('suggestion fetch failed', err);
      return [];
    }
  }

  async function geocodeCity(query){
    let lastErr = null;
    // Primary: Open-Meteo geocoding (no key, CORS-enabled)
    try{
      const res = await fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
      if(res.ok){
        const data = await res.json();
        if(data.results && data.results.length){
          const r = data.results[0];
          return { name: r.name + (r.country_code ? ', ' + r.country_code : ''), lat: r.latitude, lon: r.longitude };
        }
      } else {
        lastErr = new Error('Open-Meteo returned HTTP ' + res.status);
      }
    }catch(err){ lastErr = err; console.warn('Open-Meteo geocoding failed, trying fallback:', err); }

    // Fallback: Nominatim / OpenStreetMap (no key, widely CORS-friendly)
    try{
      const res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
      if(res.ok){
        const data = await res.json();
        if(data && data.length){
          const r = data[0];
          return { name: r.display_name.split(',')[0], lat: parseFloat(r.lat), lon: parseFloat(r.lon) };
        }
      } else {
        lastErr = new Error('Nominatim returned HTTP ' + res.status);
      }
    }catch(err){ lastErr = err; console.warn('Nominatim geocoding failed too:', err); }

    return { error: lastErr };
  }

  async function searchCity(query){
    const msg = document.getElementById('citySearchMsg');
    const btn = document.getElementById('citySearchBtn');
    if(!query) return;
    msg.style.display = 'block';
    msg.style.color = 'var(--text-dim)';
    msg.textContent = 'Searching for "' + query + '"…';
    btn.textContent = '…';
    btn.disabled = true;

    const result = await geocodeCity(query);

    btn.textContent = 'Search';
    btn.disabled = false;

    if(!result || !result.lat){
      msg.style.color = 'var(--rose-bright)';
      if(result && result.error){
        msg.textContent = 'City search failed: ' + (result.error.message || String(result.error)) + '.';
      } else {
        msg.textContent = 'City not found — check spelling.';
      }
      console.error('geocoding produced no usable result for', query, result);
      return;
    }

    msg.style.color = 'var(--text-dim)';
    msg.textContent = 'Found ' + result.name + ' (' + result.lat.toFixed(2) + ', ' + result.lon.toFixed(2) + ') — updating weather…';
    console.log('geocoded', query, '→', result);

    LOCATION.name = result.name;
    LOCATION.lat = result.lat;
    LOCATION.lon = result.lon;
    document.getElementById('citySearchInput').value = '';
    await connectWeather();
    msg.style.display = 'none';

  // ---- rain radar (Leaflet + RainViewer tiles, no key needed) ----
  // Real MeteoSwiss radar files are raw HDF5 and need a backend to decode;
  // RainViewer gives live global radar imagery (incl. Switzerland) as simple
  // map tiles that work directly in the browser. Zoom caps below (maxNativeZoom:7,
  // maxZoom:12) match RainViewer's own reference implementation — radar tiles
  // aren't rendered past native zoom 7, so Leaflet upscales instead of requesting
  // unsupported levels (that's what caused the earlier "zoom level not supported").
  let radarMapInstance = null, radarLayer = null, radarMarker = null;
  let radarFrames = [], radarFrameIdx = 0, radarTimer = null, rainviewerHost = '';

  let leafletLoadPromise = null;
  function ensureLeaflet(){
    if(window.L) return Promise.resolve();
    if(leafletLoadPromise) return leafletLoadPromise;
    leafletLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Leaflet script failed to load'));
      document.head.appendChild(s);
    });
    return leafletLoadPromise;
  }

  async function openRadarModal(){
    const backdrop = document.getElementById('radarModalBackdrop');
    const box = document.getElementById('radarModalMap');
    backdrop.classList.add('show');
    loadPrecipOutlook();
    try{
      await ensureLeaflet();
      if(!radarMapInstance){
        box.innerHTML = '';
        radarMapInstance = L.map('radarModalMap', { attributionControl:true, maxZoom:12, minZoom:3 })
          .setView([LOCATION.lat, LOCATION.lon], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: 'abcd',
          maxZoom: 12
        }).addTo(radarMapInstance);
        radarMarker = L.marker([LOCATION.lat, LOCATION.lon]).addTo(radarMapInstance);

        document.getElementById('radarPlayBtn').addEventListener('click', toggleRadarPlay);
        document.getElementById('radarSlider').addEventListener('input', (e) => {
          stopRadarPlay();
          showRadarFrame(parseInt(e.target.value, 10));
        });

        await loadRadarFrames();
      } else {
        recenterRadar(LOCATION.lat, LOCATION.lon);
      }
      requestAnimationFrame(() => radarMapInstance.invalidateSize());
      setTimeout(() => radarMapInstance && radarMapInstance.invalidateSize(), 150);
      setTimeout(() => radarMapInstance && radarMapInstance.invalidateSize(), 400);
    }catch(err){
      console.error('radar modal init failed', err);
      box.innerHTML = '<div class="radar-placeholder" style="color:var(--rose-bright);">Radar failed to load — check your connection.</div>';
    }
  }

  function closeRadarModal(){
    document.getElementById('radarModalBackdrop').classList.remove('show');
    stopRadarPlay();
  }

  async function loadRadarFrames(){
    try{
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await res.json();
      rainviewerHost = data.host;
      // RainViewer's free public API only returns past frames (confirmed in their own
      // docs: "no forecast/nowcast" on the free tier) — data.radar.nowcast will be empty
      // here. The 24h outlook below covers future rain instead, using forecast-model data.
      radarFrames = [...(data.radar.past || []), ...(data.radar.nowcast || [])].slice(-12);
      radarFrameIdx = radarFrames.length - 1;
      const slider = document.getElementById('radarSlider');
      slider.max = radarFrames.length - 1;
      slider.value = radarFrameIdx;
      showRadarFrame(radarFrameIdx);
    }catch(err){
      console.error('rainviewer fetch failed', err);
      const label = document.getElementById('radarFrameLabel');
      if(label) label.textContent = 'Unavailable';
    }
  }

  function showRadarFrame(idx){
    if(!radarFrames[idx] || !radarMapInstance) return;
    radarFrameIdx = idx;
    const frame = radarFrames[idx];
    const url = `${rainviewerHost}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
    if(radarLayer) radarMapInstance.removeLayer(radarLayer);
    radarLayer = L.tileLayer(url, { opacity:0.7, zIndex:5, maxNativeZoom:7, maxZoom:12 }).addTo(radarMapInstance);
    const slider = document.getElementById('radarSlider');
    if(slider) slider.value = idx;
    const label = document.getElementById('radarFrameLabel');
    if(label){
      const d = new Date(frame.time * 1000);
      label.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }
  }

  function toggleRadarPlay(){
    const btn = document.getElementById('radarPlayBtn');
    if(radarTimer){ stopRadarPlay(); return; }
    btn.textContent = 'Pause';
    radarTimer = setInterval(() => {
      const next = (radarFrameIdx + 1) % radarFrames.length;
      showRadarFrame(next);
    }, 500);
  }

  function stopRadarPlay(){
    clearInterval(radarTimer);
    radarTimer = null;
    const btn = document.getElementById('radarPlayBtn');
    if(btn) btn.textContent = 'Play';
  }

  function recenterRadar(lat, lon){
    if(!radarMapInstance) return;
    radarMapInstance.setView([lat, lon], 7);
    if(radarMarker) radarMapInstance.removeLayer(radarMarker);
    radarMarker = L.marker([lat, lon]).addTo(radarMapInstance);
  }

  // Radar imagery itself only extrapolates ~30-60min into the future (nowcast).
  // For a genuine 24h outlook we use Open-Meteo's forecast model instead.
  async function loadPrecipOutlook(){
    const el = document.getElementById('precipOutlook');
    const summaryEl = document.getElementById('precipSummary');
    el.innerHTML = '';
    if(summaryEl) summaryEl.textContent = 'Loading…';
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOCATION.lat}&longitude=${LOCATION.lon}&hourly=precipitation_probability,precipitation&forecast_hours=24&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const times = data.hourly.time;
      const probs = data.hourly.precipitation_probability;
      const amounts = data.hourly.precipitation;

      // Plain-language summary: find the first stretch where rain is likely
      if(summaryEl){
        let firstIdx = -1, lastIdx = -1;
        for(let i = 0; i < probs.length; i++){
          if(probs[i] >= 50){
            if(firstIdx === -1) firstIdx = i;
            lastIdx = i;
          }
        }
        if(firstIdx === -1){
          summaryEl.textContent = 'No significant rain expected in the next 24h.';
        } else {
          const fmt = (i) => new Date(times[i]).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          summaryEl.textContent = 'Rain likely between ' + fmt(firstIdx) + ' and ' + fmt(lastIdx) + '.';
        }
      }

      el.innerHTML = times.map((t, i) => {
        const pct = probs[i] || 0;
        const mm = amounts[i] || 0;
        const hour = new Date(t).getHours();
        const showLabel = i % 4 === 0;
        return `
          <div class="precip-bar-col">
            <div class="precip-bar" style="height:${Math.max(pct, 2)}%;" title="${pct}% · ${mm}mm"></div>
            ${showLabel ? `<div class="precip-bar-hour">${hour}h</div>` : ''}
          </div>`;
      }).join('');
    }catch(err){
      console.error('precip outlook failed', err);
      if(summaryEl) summaryEl.textContent = '';
      el.innerHTML = '<div class="tile-hint" style="color:var(--text-dim);">Outlook unavailable.</div>';
    }
  }

    msg.id = 'citySearchMsg';
    msg.className = 'tile-hint';
    msg.style.cssText = 'display:none; color:var(--rose-bright); margin-bottom:2px;';
    searchRow.insertAdjacentElement('afterend', msg);

    const existingBtn = tile.querySelector('button[data-module="weather"]');
    const radarBtn = document.createElement('button');
    radarBtn.className = 'tile-cta';
    radarBtn.id = 'radarToggleBtn';
    radarBtn.textContent = 'Radar';
    existingBtn.insertAdjacentElement('afterend', radarBtn);

    const cityInput = document.getElementById('citySearchInput');
    const suggestionsBox = document.getElementById('citySuggestions');
    let suggestDebounce = null;

    async function pickCity(s){
      suggestionsBox.classList.remove('show');
      cityInput.value = '';
      const msg = document.getElementById('citySearchMsg');
      msg.style.display = 'block';
      msg.style.color = 'var(--text-dim)';
      msg.textContent = 'Loading ' + s.name + '…';
      try{
        LOCATION.name = s.name + (s.region ? ', ' + s.region.split(',')[0] : '');
        LOCATION.lat = s.lat;
        LOCATION.lon = s.lon;
        await connectWeather();
        recenterRadar(s.lat, s.lon);
        if(document.getElementById('radarModalBackdrop').classList.contains('show')) loadPrecipOutlook();
        msg.style.display = 'none';
      }catch(err){
        msg.style.color = 'var(--rose-bright)';
        msg.textContent = 'Failed to load ' + s.name + ': ' + (err && err.message ? err.message : 'unknown error');
        console.error('pickCity failed', err);
      }
    }

    cityInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearTimeout(suggestDebounce);
      if(q.length < 2){
        suggestionsBox.classList.remove('show');
        return;
      }
      suggestDebounce = setTimeout(async () => {
        const results = await geocodeCitySuggestions(q);
        if(!results.length){
          suggestionsBox.classList.remove('show');
          return;
        }
        suggestionsBox.innerHTML = results.map((s, i) => `
          <div class="city-suggestion" data-idx="${i}">
            <span class="cs-name">${s.name}</span>
            <span class="cs-region">${s.region}</span>
          </div>
        `).join('');
        suggestionsBox.classList.add('show');
        suggestionsBox.querySelectorAll('.city-suggestion').forEach((el, i) => {
          el.addEventListener('click', (e) => { e.stopPropagation(); pickCity(results[i]); });
        });
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if(!searchRow.contains(e.target)) suggestionsBox.classList.remove('show');
    });

    document.getElementById('citySearchBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      suggestionsBox.classList.remove('show');
      searchCity(cityInput.value.trim());
    });
    cityInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        suggestionsBox.classList.remove('show');
        searchCity(e.target.value.trim());
      }
      if(e.key === 'Escape') suggestionsBox.classList.remove('show');
    });

    radarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openRadarModal();
    });
  }

  function sparkline(prices){
    const w = 70, h = 24;
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = (max - min) || 1;
    const step = w / (prices.length - 1);
    const pts = prices.map((p,i) => `${(i*step).toFixed(1)},${(h - ((p-min)/range)*h).toFixed(1)}`).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
  }

          const q = STOCKS.length > 1 ? data[asset.symbol] : data;
          if(!q || q.status === 'error' || q.close == null) return '';
          return renderStockRow(asset, q);
        }).join('');
      }catch(err){
        console.error('stocks fetch failed', err);
        stocksHTML = sectionLabel('Stocks & more') + `<div class="tile-hint">Stock/index prices failed to load.</div>`;
      }
    } else {
      stocksHTML = sectionLabel('Stocks & more') + `<div class="tile-hint">Add a free Twelve Data API key (twelvedata.com/pricing, no card needed) to enable S&amp;P 500, gold, silver &amp; stocks — set TWELVE_DATA_KEY near the top of the markets code.</div>`;
    }

    stateEl.textContent = ok ? 'Live — CoinGecko + Twelve Data' : 'Connection error';
    bodyEl.innerHTML = cryptoHTML + stocksHTML;

    btn.textContent = 'Refresh';
    btn.disabled = false;
    btn.style.opacity = 1;
    btn.style.cursor = 'pointer';
    btn.onclick = (e) => { e.stopPropagation(); connectMarkets(); };

    if(ok){ connected.add('markets'); refreshCount(); }
  }

  // ---- stock/ticker search: add any symbol to the tracked list ----
  async function searchStock(rawSymbol){
    const msg = document.getElementById('stockSearchMsg');
    const btn = document.getElementById('stockSearchBtn');
    const symbol = rawSymbol.trim().toUpperCase();
    if(!symbol) return;
    msg.style.display = 'none';

    if(!TWELVE_DATA_KEY){
      msg.textContent = 'Add a Twelve Data API key first (see note below).';
      msg.style.display = 'block';
      return;
    }
    if(STOCKS.some(s => s.symbol.toUpperCase() === symbol)){
      msg.textContent = symbol + ' is already tracked.';
      msg.style.display = 'block';
      return;
    }

    btn.textContent = '…';
    btn.disabled = true;
    let found = false;
    try{
      const res = await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(symbol)}&apikey=${TWELVE_DATA_KEY}`);
      const q = await res.json();
      if(!res.ok || q.status === 'error' || q.close == null){
        msg.textContent = q.message || (symbol + ' not found.');
        msg.style.display = 'block';
      } else {
        STOCKS.push({ symbol, label: symbol, tv: symbol });
        document.getElementById('stockSearchInput').value = '';
        found = true;
      }
    }catch(err){
      msg.textContent = 'Search failed: ' + (err && err.message ? err.message : 'unknown error') + '.';
      msg.style.display = 'block';
      console.error('stock search failed', err);
    }
    btn.textContent = 'Add';
    btn.disabled = false;
    if(found) await connectMarkets();
  }

  function augmentMarketsTile(){
    const tile = document.querySelector('[data-module="markets"]').closest('.tile');
    const head = tile.querySelector('.tile-head');
    const searchRow = document.createElement('div');
    searchRow.style.cssText = 'display:flex; gap:8px; margin:2px 0 4px;';
    searchRow.innerHTML = `
      <input id="stockSearchInput" type="text" placeholder="Add ticker (e.g. TSLA)…" style="flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:2px; color:var(--text); padding:7px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px; outline:none;">
      <button id="stockSearchBtn" class="tile-cta" style="margin-top:0;">Add</button>
    `;
    head.insertAdjacentElement('afterend', searchRow);

    const msg = document.createElement('div');
    msg.id = 'stockSearchMsg';
    msg.className = 'tile-hint';
    msg.style.cssText = 'display:none; color:var(--rose-bright); margin-bottom:2px;';
    searchRow.insertAdjacentElement('afterend', msg);

    document.getElementById('stockSearchBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      searchStock(document.getElementById('stockSearchInput').value);
    });
    document.getElementById('stockSearchInput').addEventListener('keydown', (e) => {
      if(e.key === 'Enter') searchStock(e.target.value);
    });
  }
  augmentMarketsTile();
  connectMarkets();

  // ---- chart modal (TradingView widget, all timeframes built in) ----
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const chartContainer = document.getElementById('tv-chart-container');
  let tvScriptLoaded = false;

  function loadTvScript(){
    return new Promise((resolve, reject) => {
      if(tvScriptLoaded && window.TradingView){ resolve(); return; }
      const s = document.createElement('script');
      s.src = 'https://s3.tradingview.com/tv.js';
      s.onload = () => { tvScriptLoaded = true; resolve(); };
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function openChart(tvSymbol, title){
    modalTitle.textContent = title;
    modalBackdrop.classList.add('show');
    chartContainer.innerHTML = '';
    try{
      await loadTvScript();
      new TradingView.widget({
        autosize: true,
        symbol: tvSymbol,
        interval: '60',
        timezone: 'Etc/UTC',
        theme: 'dark',
        style: '1',
        locale: 'en',
        toolbar_bg: '#1f1f23',
        enable_publishing: false,
        allow_symbol_change: true,
        hide_top_toolbar: false,
        withdateranges: true,
        container_id: 'tv-chart-container'
      });
    }catch(err){
      chartContainer.innerHTML = '<div style="padding:20px; color:var(--text-dim); font-family:JetBrains Mono, monospace; font-size:12px;">Chart failed to load — check your connection.</div>';
      console.error('tradingview load failed', err);
    }
  }

  function closeChart(){
    modalBackdrop.classList.remove('show');
    chartContainer.innerHTML = '';
  }

  document.getElementById('modalClose').addEventListener('click', closeChart);
  modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeChart(); });
  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    closeChart();
    closeRadarModal();
  });

  grid.addEventListener('click', (e) => {
    const row = e.target.closest('.coin-row');
    if(!row || !row.dataset.tv) return;
    openChart(row.dataset.tv, row.dataset.title);
  });

  // ---- AI Chat (Groq primary, Gemini fallback) ----
  // Groq: get a free key at https://console.groq.com/keys (no card needed).
  // Runs stable open-weight models (Llama) that don't get deprecated/overloaded
  // the way Gemini's newest "latest" alias does — chosen as primary for reliability.
  const GROQ_API_KEY = '';
  const GROQ_MODEL = 'llama-3.3-70b-versatile';

  // Gemini stays as a fallback since a key's already set up — used only if
  // Groq isn't configured or fails.
  const GEMINI_API_KEY = 'AQ.Ab8RN6J7aHE5R1UYsx5a93FvoZzGaZslGEAjHWaEmZx6Rnk7ew';
  const GEMINI_MODEL = 'gemini-flash-latest'; // an alias Google keeps pointed at whatever's current — avoids hardcoding a version that gets deprecated

  const ACTIVE_MODEL_LABEL = GROQ_API_KEY ? GROQ_MODEL : GEMINI_MODEL;

  // Neutral format: { role: 'user'|'assistant', text }. Converted per-provider at call time.
  let chatHistory = [];
  let chatActive = false;

  function withScrollLock(fn){
    const grid = document.getElementById('grid');
    const y = grid.scrollTop;
    fn();
    grid.scrollTop = y;
    requestAnimationFrame(() => { grid.scrollTop = y; });
  }

  function addChatMessage(role, text){
    const list = document.getElementById('chatMessages');
    let el;
    withScrollLock(() => {
      el = document.createElement('div');
      el.className = 'chat-msg ' + role;
      el.textContent = text;
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
    });
    return el;
  }

  async function callGroq(){
    const res = await fetchWithTimeout('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: chatHistory.map(m => ({ role: m.role, content: m.text }))
      })
    }, 20000);
    const data = await res.json();
    if(!res.ok){
      const err = new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!reply) throw new Error('Empty response from Groq.');
    return reply;
  }

  async function callGemini(){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    const res = await fetchWithTimeout(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY },
      body: JSON.stringify({
        contents: chatHistory.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.text }] }))
      })
    }, 20000);
    const data = await res.json();
    if(!res.ok){
      const err = new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    const reply = data.candidates && data.candidates[0] && data.candidates[0].content
      && data.candidates[0].content.parts && data.candidates[0].content.parts.map(p => p.text || '').join('');
    if(!reply) throw new Error('Empty response from Gemini.');
    return reply;
  }

  function isRetryable(err){
    return err.status === 503 || err.status === 429 || /high demand|overloaded|quota|no longer available/i.test(err.message || '');
  }

  async function askAI(thinkingEl){
    const providers = [];
    if(GROQ_API_KEY) providers.push({ name: GROQ_MODEL + ' (Groq)', call: callGroq });
    providers.push({ name: GEMINI_MODEL + ' (Gemini)', call: callGemini });

    let lastErr;
    for(let i = 0; i < providers.length; i++){
      try{
        return await providers[i].call();
      }catch(err){
        lastErr = err;
        if(!isRetryable(err) && i === providers.length - 1) throw err;
        if(i < providers.length - 1 && thinkingEl){
          thinkingEl.textContent = providers[i].name + ' unavailable — trying ' + providers[i+1].name + '…';
        }
      }
    }
    throw lastErr;
  }

  async function sendChatMessage(){
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('chatSendBtn');
    const text = input.value.trim();
    if(!text) return;

    addChatMessage('user', text);
    chatHistory.push({ role: 'user', text });
    input.value = '';
    btn.disabled = true;
    const thinking = addChatMessage('assistant', '…');

    try{
      const reply = await askAI(thinking);
      thinking.textContent = reply;
      chatHistory.push({ role: 'assistant', text: reply });
    }catch(err){
      thinking.remove();
      addChatMessage('system', 'AI request failed: ' + err.message);
      console.error('chat failed', err);
      chatHistory.pop(); // drop the unanswered user turn so retry doesn't duplicate context
    }
    btn.disabled = false;
    // no auto-focus here — focusing an input can trigger the browser's
    // own scroll-into-view behavior, which is what was moving the page
  }

  function activateChat(){
    const tile = document.getElementById('chatActivateBtn').closest('.tile');
    if(!GROQ_API_KEY && !GEMINI_API_KEY){
      let noteEl = tile.querySelector('.tile-need');
      if(!noteEl){
        noteEl = document.createElement('div');
        noteEl.className = 'tile-hint tile-need';
        noteEl.style.color = 'var(--text-dim)';
        tile.querySelector('.chat-left').appendChild(noteEl);
      }
      noteEl.textContent = 'Add a free key — Groq (console.groq.com/keys) is recommended for reliability, set GROQ_API_KEY near the bottom of the code.';
      return;
    }
    if(chatActive) return;
    chatActive = true;
    withScrollLock(() => {
      tile.classList.add('active');
      tile.innerHTML = `
        <div class="chat-top">
          <div class="tile-name">AI CHAT</div>
          <span class="tile-idx">${ACTIVE_MODEL_LABEL}</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Ask about your day…">
          <button class="tile-cta" id="chatSendBtn" style="margin-top:0;">Send</button>
        </div>
      `;
      addChatMessage('system', 'Connected to ' + ACTIVE_MODEL_LABEL + ' — ask anything.');
      document.getElementById('chatSendBtn').addEventListener('click', (e) => { e.stopPropagation(); sendChatMessage(); });
      document.getElementById('chatInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') sendChatMessage(); });
      // no auto-focus — same reasoning as above
    });
  }

  document.getElementById('chatActivateBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    activateChat();
  });
</script>
