  // Rough CHF estimate from straight-line distance between first departure and
  // last arrival. Real SBB fares use a zone/distance model this open API doesn't
  // expose — this is a ballpark only, labeled as such, not a bookable price.
  // Official SBB deep-linking format (per SBB's own community-documented guide) —
  // opens sbb.ch with this exact route/time pre-filled so real pricing can be checked.
  function sbbDeepLink(fromName, toName, isoDatetime){
    const d = new Date(isoDatetime);
    const datum = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
    const zeit = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    const params = new URLSearchParams({ von: fromName, nach: toName, datum, zeit, suche: 'true' });
    return 'https://www.sbb.ch/en/buying/pages/fahrplan/fahrplan.xhtml?' + params.toString();
  }

  function estimateFareCHF(connection){
    const sections = (connection.sections || []).filter(s => s.departure && s.arrival);
    if(!sections.length) return null;
    const first = sections[0].departure.station;
    const last = sections[sections.length - 1].arrival.station;
    if(!first || !last || !first.coordinate || !last.coordinate) return null;
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(last.coordinate.x - first.coordinate.x);
    const dLon = toRad(last.coordinate.y - first.coordinate.y);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(first.coordinate.x)) * Math.cos(toRad(last.coordinate.x)) * Math.sin(dLon/2)**2;
    const distKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const fare = 3 + distKm * 0.31; // base fare + rough per-km rate, 2nd class, no discount card
    return Math.round(fare);
  }

  function renderTransitConnections(connections, fromName, toName){
    const body = document.getElementById('transitModalBody');
    body.innerHTML = connections.map((c, i) => {
      const dep = new Date(c.from.departure).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
      const arr = new Date(c.to.arrival).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
      const durMatch = (c.duration || '').match(/(\d+)d(\d+):(\d+)/);
      let durationStr = c.duration || '';
      if(durMatch){
        const hours = parseInt(durMatch[2], 10) + parseInt(durMatch[1], 10) * 24;
        durationStr = (hours ? hours + 'h ' : '') + durMatch[3] + 'm';
      }
      const transferCount = c.transfers || 0;
      const transfersStr = transferCount === 0 ? 'Direct' : transferCount + (transferCount === 1 ? ' transfer' : ' transfers');
      const fare = estimateFareCHF(c);
      const sbbUrl = sbbDeepLink(fromName, toName, c.from.departure);
      const legs = (c.sections || []).filter(s => s.journey || s.walk).map(s => {
        if(s.walk) return `<div class="transit-leg"><div class="transit-leg-dot"></div>Walk${s.walk.duration ? ' · ' + Math.round(s.walk.duration/60) + ' min' : ''}</div>`;
        const line = s.journey ? ((s.journey.category || '') + (s.journey.number || '')) : '';
        const depName = s.departure && s.departure.station ? s.departure.station.name : '';
        const arrName = s.arrival && s.arrival.station ? s.arrival.station.name : '';
        return `<div class="transit-leg"><div class="transit-leg-dot"></div>${line} ${depName} → ${arrName}</div>`;
      }).join('');
      return `
        <div class="transit-conn" data-conn-idx="${i}">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--text);">${dep} → ${arr}</div>
            <div style="text-align:right;">
              <div style="font-size:11px; color:var(--text-dim);">${durationStr} · ${transfersStr}</div>

  let transitMapInstance = null;
  async function showTransitRouteOnMap(connection){
    const mapEl = document.getElementById('transitModalMap');
    try{
      await ensureLeaflet();
      const points = [];
      (connection.sections || []).forEach(s => {
        if(s.departure && s.departure.station && s.departure.station.coordinate && s.departure.station.coordinate.x){
          points.push({ lat: s.departure.station.coordinate.x, lon: s.departure.station.coordinate.y, name: s.departure.station.name });
        }
        if(s.arrival && s.arrival.station && s.arrival.station.coordinate && s.arrival.station.coordinate.x){
          points.push({ lat: s.arrival.station.coordinate.x, lon: s.arrival.station.coordinate.y, name: s.arrival.station.name });
        }
      });
      if(!points.length){
        mapEl.innerHTML = '<div class="radar-placeholder">No map data for this route.</div>';
        return;
      }
      mapEl.innerHTML = '';
      if(transitMapInstance){ transitMapInstance.remove(); transitMapInstance = null; }
      transitMapInstance = L.map('transitModalMap').setView([points[0].lat, points[0].lon], 9);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
      }).addTo(transitMapInstance);
      const latlngs = points.map(p => [p.lat, p.lon]);
      L.polyline(latlngs, { color:'var(--rose-bright)', weight:3 }).addTo(transitMapInstance);
      points.forEach(p => L.marker([p.lat, p.lon]).addTo(transitMapInstance).bindPopup(p.name));
      transitMapInstance.fitBounds(latlngs, { padding:[24,24] });
      setTimeout(() => { transitMapInstance && transitMapInstance.invalidateSize(); }, 100);
    }catch(err){
      console.error('transit map failed', err);
      mapEl.innerHTML = '<div class="radar-placeholder" style="color:var(--rose-bright);">Map failed to load.</div>';
    }
  }

  const CURRENCIES = ['USD', 'EUR', 'CHF', 'GBP', 'JPY', 'CNY', 'CAD', 'AUD'];
  const UNIT_CATEGORIES = {
    length: { units: { mm:0.001, cm:0.01, m:1, km:1000, in:0.0254, ft:0.3048, yd:0.9144, mi:1609.344 }, default: ['m', 'ft'] },

  let convCategory = 'currency';

  function celsiusToUnit(c, unit){
    if(unit === '°C') return c;
    if(unit === '°F') return c * 9/5 + 32;
    if(unit === 'K') return c + 273.15;
  }
  function unitToCelsius(v, unit){
    if(unit === '°C') return v;
    if(unit === '°F') return (v - 32) * 5/9;
    if(unit === 'K') return v - 273.15;
  }

      fromSel.value = 'CHF'; toSel.value = 'EUR';

  async function runConversion(){
    const amount = parseFloat(document.getElementById('convAmount').value);
    const from = document.getElementById('convFrom').value;
    const to = document.getElementById('convTo').value;
    const resultEl = document.getElementById('convResult');
    const equationEl = document.getElementById('convEquationLine');
    const metaEl = document.getElementById('convMeta');
    metaEl.textContent = '';
    const amountLabel = isNaN(amount) ? '' : amount.toLocaleString('en-US', { maximumFractionDigits:4 });
    equationEl.textContent = amountLabel ? `${amountLabel} ${from} equals` : '';
    if(isNaN(amount)){ resultEl.textContent = '—'; return; }

    if(convCategory === 'currency'){
      if(from === to){
        resultEl.textContent = amount.toLocaleString('en-US', { maximumFractionDigits:2 }) + ' ' + to;
        metaEl.textContent = 'Same currency';
        return;
      }
      try{
        const res = await fetchWithTimeout(`https://api.frankfurter.dev/v2/rate/${from}/${to}`, null, 6000);
        const data = await res.json();
        if(!res.ok || data.rate == null) throw new Error((data && data.message) || 'Conversion failed');
        resultEl.textContent = (amount * data.rate).toLocaleString('en-US', { maximumFractionDigits:2 }) + ' ' + to;
        metaEl.textContent = 'ECB reference rate';
      }catch(err){
        console.error('currency conversion failed', err);
        resultEl.textContent = '—';
        metaEl.textContent = err.message || 'Conversion failed.';
      }
      return;
    }

    let result;
    if(convCategory === 'temp'){
      result = celsiusToUnit(unitToCelsius(amount, from), to);
    } else {
      const cat = UNIT_CATEGORIES[convCategory];
      result = (amount * cat.units[from]) / cat.units[to];
    }
    resultEl.textContent = result.toLocaleString('en-US', { maximumFractionDigits:4 }) + ' ' + to;
  }

  // ---- re-encode to WAV/AIFF natively or MP3 via lamejs) ----
  document.getElementById('audioFormat').addEventListener('change', (e) => {

  function floatTo16BitPCM(floatArray){
    const int16 = new Int16Array(floatArray.length);
    for(let i = 0; i < floatArray.length; i++){
      const s = Math.max(-1, Math.min(1, floatArray[i]));
      int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return int16;
  }

  function audioBufferToWav(buffer){
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const bytesPerSample = 2;
    const blockAlign = numChannels * bytesPerSample;
    const numSamples = buffer.length;
    const dataSize = numSamples * blockAlign;
    const arrBuf = new ArrayBuffer(44 + dataSize);
    const view = new DataView(arrBuf);
    const writeStr = (offset, str) => { for(let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };

    writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(8, 'WAVE');
    writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true); view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeStr(36, 'data'); view.setUint32(40, dataSize, true);

    const channelData = [];
    for(let ch = 0; ch < numChannels; ch++) channelData.push(buffer.getChannelData(ch));
    let offset = 44;
    for(let i = 0; i < numSamples; i++){
      for(let ch = 0; ch < numChannels; ch++){
        const s = Math.max(-1, Math.min(1, channelData[ch][i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }
    }
    return new Blob([arrBuf], { type: 'audio/wav' });
  }

  function writeIEEE80(view, offset, value){
    const sign = value < 0 ? 1 : 0;
    value = Math.abs(value);
    const exp = Math.floor(Math.log(value) / Math.LN2);
    const mantissa = (value / Math.pow(2, exp)) * Math.pow(2, 63);
    view.setUint16(offset, (sign << 15) | (exp + 16383), false);
    view.setUint32(offset + 2, Math.floor(mantissa / Math.pow(2, 32)), false);
    view.setUint32(offset + 6, mantissa % Math.pow(2, 32), false);
  }

  function audioBufferToAiff(buffer){
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const numSamples = buffer.length;
    const dataSize = numSamples * numChannels * 2;
    const commSize = 18, ssndSize = 8 + dataSize;
    const formSize = 4 + (8 + commSize) + (8 + ssndSize);
    const arrBuf = new ArrayBuffer(8 + formSize);
    const view = new DataView(arrBuf);
    const writeStr = (offset, str) => { for(let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };

    writeStr(0, 'FORM'); view.setUint32(4, formSize, false); writeStr(8, 'AIFF');
    writeStr(12, 'COMM'); view.setUint32(16, commSize, false);
    view.setUint16(20, numChannels, false); view.setUint32(22, numSamples, false);
    view.setUint16(26, 16, false); writeIEEE80(view, 28, sampleRate);
    writeStr(38, 'SSND'); view.setUint32(42, ssndSize, false);
    view.setUint32(46, 0, false); view.setUint32(50, 0, false);

    const channelData = [];
    for(let ch = 0; ch < numChannels; ch++) channelData.push(buffer.getChannelData(ch));
    let offset = 54;
    for(let i = 0; i < numSamples; i++){
      for(let ch = 0; ch < numChannels; ch++){
        const s = Math.max(-1, Math.min(1, channelData[ch][i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, false);
        offset += 2;
      }
    }
    return new Blob([arrBuf], { type: 'audio/aiff' });
  }

  async function audioBufferToMp3(buffer, bitrate, onProgress){
    const numChannels = Math.min(2, buffer.numberOfChannels);
    const encoder = new lamejs.Mp3Encoder(numChannels, buffer.sampleRate, bitrate);
    const mp3Data = [];
    const blockSize = 1152;
    const left = floatTo16BitPCM(buffer.getChannelData(0));
    const right = numChannels > 1 ? floatTo16BitPCM(buffer.getChannelData(1)) : null;
    const totalChunks = Math.ceil(left.length / blockSize);

    for(let i = 0, chunk = 0; i < left.length; i += blockSize, chunk++){
      const leftChunk = left.subarray(i, i + blockSize);
      const buf = right ? encoder.encodeBuffer(leftChunk, right.subarray(i, i + blockSize)) : encoder.encodeBuffer(leftChunk);
      if(buf.length > 0) mp3Data.push(buf);
      // Yield to the event loop periodically so the progress bar can actually
      // repaint - a tight synchronous loop blocks all rendering until done.
      if(chunk % 200 === 0){
        if(onProgress) onProgress(chunk / totalChunks);
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }
    const end = encoder.flush();
    if(end.length > 0) mp3Data.push(end);
    return new Blob(mp3Data, { type: 'audio/mp3' });
  }

    const setProgress = (pct) => { progressFill.style.width = Math.min(100, Math.max(0, pct)) + '%'; };
    btn.textContent = 'Converting…';

    progressWrap.style.display = 'block';

    try{

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      setProgress(30);

      let blob, ext;
      if(format === 'wav'){ blob = audioBufferToWav(audioBuffer); ext = 'wav'; setProgress(95); }
      else if(format === 'aiff'){ blob = audioBufferToAiff(audioBuffer); ext = 'aiff'; setProgress(95); }
      else {
        blob = await audioBufferToMp3(audioBuffer, bitrate, (frac) => setProgress(30 + frac * 65));
        ext = 'mp3';

      setProgress(100);

      const baseName = file.name.replace(/\.[^.]+$/, '');
      const fileName = `${baseName}.${ext}`;
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = fileName;

      downloadWrap.style.display = 'flex';
      audioCtx.close();
    }catch(err){
      console.error('audio conversion failed', err);
      msg.textContent = 'Conversion failed: ' + err.message;
      msg.style.color = 'var(--rose-bright)';
      msg.style.display = 'block';

  document.getElementById('imageConvertBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    const fileInput = document.getElementById('imageFileInput');
    const format = document.getElementById('imageFormat').value;
    const quality = parseInt(document.getElementById('imageQuality').value, 10) / 100;
    const maxWidth = parseInt(document.getElementById('imageMaxWidth').value, 10) || null;
    const msg = document.getElementById('imageMsg');
    const previewWrap = document.getElementById('imagePreviewWrap');
    const btn = document.getElementById('imageConvertBtn');
    const progressWrap = document.getElementById('imageProgressWrap');
    const progressFill = document.getElementById('imageProgressFill');
    msg.style.display = 'none';
    previewWrap.style.display = 'none';

    if(!fileInput.files.length){
      msg.textContent = 'Choose a file first.';
      msg.style.color = 'var(--rose-bright)';
      msg.style.display = 'block';
      return;
    }

    const setProgress = (pct) => { progressFill.style.width = Math.min(100, Math.max(0, pct)) + '%'; };
    btn.textContent = 'Converting…';
    btn.disabled = true;
    progressWrap.style.display = 'block';
    setProgress(0);
    try{
      const file = fileInput.files[0];
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      setProgress(25);
      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = dataUrl;
      });
      setProgress(50);

      let { width, height } = img;
      if(maxWidth && width > maxWidth){
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx2d = canvas.getContext('2d');
      // PNG/JPEG have no alpha-less requirement, but for JPEG output on a
      // transparent source, fill white first so it doesn't render black.
      if(format === 'jpeg'){
        ctx2d.fillStyle = '#fff';
        ctx2d.fillRect(0, 0, width, height);
      }
      ctx2d.drawImage(img, 0, 0, width, height);
      setProgress(75);

      const mimeType = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
      const blob = await new Promise(resolve => canvas.toBlob(resolve, mimeType, format === 'png' ? undefined : quality));
      if(!blob) throw new Error('Encoding failed (format may be unsupported by your browser).');
      setProgress(100);

      const ext = format === 'jpeg' ? 'jpg' : format;
      const baseName = file.name.replace(/\.[^.]+$/, '');

      document.getElementById('imageDownloadName').textContent = `${fileName} (${(blob.size/1024).toFixed(0)} KB)`;
      previewWrap.style.display = 'flex';
    }catch(err){
      console.error('image conversion failed', err);
      msg.textContent = 'Conversion failed: ' + err.message;
      msg.style.color = 'var(--rose-bright)';
      msg.style.display = 'block';
    }
    setTimeout(() => { progressWrap.style.display = 'none'; setProgress(0); }, 500);
    btn.textContent = 'Convert';
    btn.disabled = false;
  });

  function generateQR(){

    if(!text){

    }
    if(!window.QRCode){
      wrap.innerHTML = '<span class="tile-hint" style="color:#c00;">QR library failed to load.</span>';
      resultWrap.classList.add('open');
      return;
    }
    wrap.innerHTML = '<canvas id="qrCanvas"></canvas>';
    QRCode.toCanvas(document.getElementById('qrCanvas'), text, { width: 160, margin: 1 }, (err) => {
      if(err){
        console.error('QR generation failed', err);
        wrap.innerHTML = '<span class="tile-hint" style="color:#c00;">Failed to generate.</span>';
        downloadLink.style.display = 'none';
        resultWrap.classList.add('open');
        return;
      }
      const canvas = document.getElementById('qrCanvas');
      downloadLink.href = canvas.toDataURL('image/png');
      downloadLink.style.display = 'block';
      resultWrap.classList.add('open');
    });
  }
  document.getElementById('qrInput').addEventListener('input', () => {
    clearTimeout(qrDebounce);
    qrDebounce = setTimeout(generateQR, 300);
  });

  // ---- Tap Tempo ----
  let tapTimes = [];
  function registerTap(){
    const now = performance.now();
    if(tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = []; // idle too long, restart
    tapTimes.push(now);
    if(tapTimes.length > 8) tapTimes.shift();
    if(tapTimes.length >= 2){
      const intervals = [];
      for(let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
      const avgMs = intervals.reduce((a,b) => a+b, 0) / intervals.length;
      const bpm = Math.round(60000 / avgMs);
      document.getElementById('tapBpm').textContent = bpm;
    }
  }
  document.getElementById('tapBtn').addEventListener('click', (e) => { e.stopPropagation(); registerTap(); });
  addRefreshIcon('taptempo', () => {
    tapTimes = [];
    document.getElementById('tapBpm').textContent = '—';
  });
  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space' && !e.target.matches('input, textarea')){
      e.preventDefault();
      registerTap();
    }
  });

</script>
